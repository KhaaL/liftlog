function weeklyChart(ws){
  const weeks = [];
  const now = new Date();
  for (let i = 7; i >= 0; i--){
    const start = new Date(now); start.setDate(now.getDate() - now.getDay() - i*7); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(start.getDate() + 7);
    const vol = ws.filter(w => w.startedAt >= start.getTime() && w.startedAt < end.getTime())
                  .reduce((a,w) => a + workoutVolume(w), 0);
    weeks.push({ label: start.toLocaleDateString(undefined,{ month:'short', day:'numeric' }), vol });
  }
  const max = Math.max(1, ...weeks.map(w => w.vol));
  const W = 560, H = 90, bw = W/weeks.length;
  let bars = '';
  weeks.forEach((w,i) => {
    const h = Math.round(w.vol/max * (H-26));
    const x = Math.round(i*bw + bw*0.18), y = H - 18 - h;
    const last = i === weeks.length - 1;
    bars += '<rect x="' + x + '" y="' + (w.vol ? y : H-19) + '" width="' + Math.round(bw*0.64) + '" height="' + (w.vol ? h : 1) + '" rx="2" fill="' + (last ? 'var(--accent)' : 'var(--border-strong)') + '"><title>' + esc(w.label) + ' — ' + fmtNum(w.vol) + ' ' + unitLabel() + '</title></rect>';
    if (i % 2 === 0) bars += '<text x="' + Math.round(i*bw + bw/2) + '" y="' + (H-4) + '" text-anchor="middle" font-size="9.5" fill="var(--muted)">' + esc(w.label) + '</text>';
  });
  return '<section class="panel chart-panel mt-4" aria-label="Weekly volume, last 8 weeks">' +
    '<div class="chart-head"><h2 class="panel-title">Weekly volume</h2>' +
    '<span class="muted xs">total weight × reps per week</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart of training volume for the last eight weeks">' + bars + '</svg>' +
  '</section>';
}
function trendPanel(){
  const candidates = trendCandidates();
  if (!candidates.length) return '';
  const ex = exerciseById(ui.trendExId);
  if (!ex) return '';
  const isWeighted = ex.unit !== 'bw' && ex.unit !== 'time';
  const metric = s => isWeighted ? epley(setWeight(s), s.reps)
    : (ex.unit === 'time' ? (Number(setDuration(s)) || 0) : (Number(s.reps) || 0));
  const metricName = isWeighted ? 'estimated 1RM' : (ex.unit === 'time' ? 'longest hold (s)' : 'best set (reps)');
  const unit = isWeighted ? unitLabel() : (ex.unit === 'time' ? 's' : 'reps');

  const sessions = [];
  sortedWorkouts().slice().reverse().forEach(w => {   /* oldest → newest for the line */
    const b = w.exercises.find(x => x.exerciseId === ex.id);
    if (!b) return;
    const best = b.sets.filter(countsPR).reduce((a,s) => Math.max(a, metric(s)), 0);
    if (best > 0) sessions.push({ date:w.startedAt, best });
  });

  let body = '';
  if (sessions.length < 2){
    body = '<p class="muted small">Log this exercise in two or more sessions to see a trend line.</p>';
  } else {
    const vals = sessions.map(s => s.best);
    const min = Math.min(...vals), max = Math.max(...vals);
    const W = 560, H = 96, pad = 10;
    const x = i => pad + (i/(vals.length-1)) * (W - pad*2);
    const y = v => max === min ? H/2 : (H - pad - ((v - min)/(max - min)) * (H - pad*2));
    const r1 = n => Math.round(n*10)/10;
    const pts = vals.map((v,i) => r1(x(i)) + ',' + r1(y(v))).join(' ');
    const dots = vals.map((v,i) =>
      '<circle cx="' + r1(x(i)) + '" cy="' + r1(y(v)) + '" r="' + (i === vals.length-1 ? 4 : 2.5) + '" fill="' + (i === vals.length-1 ? 'var(--accent)' : 'var(--surface)') + '" stroke="var(--accent)" stroke-width="1.6"><title>' + fmtDate(sessions[i].date) + ' — ' + fmtNum(roundHalf(v)) + ' ' + esc(unit) + '</title></circle>').join('');
    const delta = vals[vals.length-1] - vals[0];
    body = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trend of ' + metricName + ' for ' + esc(ex.name) + ' across ' + vals.length + ' sessions">' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + dots + '</svg>' +
      '<div class="trend-foot">' +
        '<span class="muted xs">' + fmtDate(sessions[0].date) + ' → ' + fmtDate(sessions[sessions.length-1].date) + ' · ' + plural(sessions.length, 'session') + '</span>' +
        '<span class="xs trend-delta ' + (delta >= 0 ? 'up' : 'down') + '">' +
          (delta >= 0 ? '▲ +' : '▼ ') + fmtNum(roundHalf(delta)) + ' ' + esc(unit) + '</span>' +
      '</div>' +
      '<p class="sr-only">' + metricName + ' went from ' + fmtNum(roundHalf(vals[0])) + ' to ' + fmtNum(roundHalf(vals[vals.length-1])) + ' ' + esc(unit) + '.</p>';
  }

  return '<section class="panel chart-panel mt-4" aria-label="Exercise trend">' +
    '<div class="chart-head">' +
      '<h2 class="panel-title">Progress</h2>' +
      '<label class="field trend-picker"><span class="cap">Exercise</span>' +
      '<select data-change="trend">' +
      candidates.map(e => '<option value="' + e.id + '"' + (e.id === ui.trendExId ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('') +
      '</select></label>' +
    '</div>' +
    '<p class="muted xs mb-2">' + esc(metricName) + ' per session</p>' +
    body +
  '</section>';
}

      '<span class="list-actions">' +
        '<button type="button" class="btn btn-sm" data-action="ex-edit" data-id="' + e.id + '" aria-label="Edit ' + esc(e.name) + '">Edit</button>' +
        '<button type="button" class="btn btn-sm btn-danger" data-action="ex-del" data-id="' + e.id + '" aria-label="Delete ' + esc(e.name) + '">' + IC.trash + '<span class="sr-only">Delete</span></button>' +
      '</span></li>';
  });
  html += '</ul>';
  if (!shown.length) html += '<p class="hint">No exercises match your filter.</p>';
  return head + html;
}
/* the muscle-group values already in the library, offered as autocomplete */
function categoryDatalist(id){
  const cats = Array.from(new Set(state.exercises.map(e => e.category).filter(Boolean)));
  return '<datalist id="' + id + '">' + cats.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>';
}
function htmlExerciseForm(){
  return '<section class="panel mb-4"><div class="pad">' +
    '<form data-form="ex-new">' +
      '<h3 class="panel-title mb-3">New exercise</h3>' +
      '<div class="ex-edit-grid">' +
        '<label class="field"><span class="cap">Name</span><input type="text" name="exname" required placeholder="e.g. Incline Press"></label>' +
        '<label class="field"><span class="cap">Muscle group</span><input type="text" name="excat" list="ex-cats" placeholder="Chest, Back…">' +
          categoryDatalist('ex-cats') + '</label>' +
        '<label class="field"><span class="cap">Default unit</span>' +
          '<select name="exunit">' + unitOptions('kg') + '</select></label>' +
      '</div>' +
      '<label class="field mt-3"><span class="cap">Notes (optional)</span>' +
        '<input type="text" name="exnotes" placeholder="Cues, tempo, grip…"></label>' +
      (ui.exerciseFormError ? '<p class="error-text mt-2" role="alert">' + esc(ui.exerciseFormError) + '</p>' : '') +
      '<div class="form-actions mt-3">' +
        '<button type="submit" class="btn btn-primary">Add exercise</button>' +
        '<button type="button" class="btn" data-action="ex-form-close">Cancel</button>' +
      '</div>' +
    '</form></div></section>';
}
function htmlExerciseEditRow(e){
  const d = ui.exerciseDraft;
  return '<li class="list-row is-editing">' +
    '<form data-form="ex-save">' +
      '<div class="ex-edit-grid">' +
        '<label class="field"><span class="cap">Name</span><input type="text" data-bind="edraft" data-field="name" value="' + esc(d.name) + '" required></label>' +
        '<label class="field"><span class="cap">Muscle group</span><input type="text" data-bind="edraft" data-field="category" value="' + esc(d.category) + '" list="ex-cats-edit">' +
          categoryDatalist('ex-cats-edit') + '</label>' +
        '<label class="field"><span class="cap">Default unit</span>' +
          '<select data-bind="edraft" data-field="unit">' + unitOptions(d.unit) + '</select></label>' +
      '</div>' +
      '<label class="field mt-3"><span class="cap">Notes</span>' +
        '<input type="text" data-bind="edraft" data-field="notes" value="' + esc(d.notes) + '"></label>' +
      '<div class="form-actions mt-3">' +
        '<button type="submit" class="btn btn-primary btn-sm">Save</button>' +
        '<button type="button" class="btn btn-sm" data-action="ex-edit-cancel">Cancel</button>' +
      '</div>' +
    '</form></li>';
}

/* ---------- SETTINGS ---------- */
/* One shortcut list renders both here and in the help dialog. */
function shortcutTable(){
  return '<table class="shortcuts"><tbody>' +
    SHORTCUTS.map(sc => '<tr><td>' + sc.keys.map(k => '<kbd>' + esc(k) + '</kbd>').join(' ') +
      '</td><td>' + esc(sc.text) + '</td></tr>').join('') +
    '</tbody></table>';
}
function storageSize(){
  try{
    const bytes = new Blob([localStorage.getItem(LS_KEY) || '']).size;
    return (bytes < 1024) ? bytes + ' B' : Math.round(bytes/102.4)/10 + ' KB';
  }catch(e){ return '–'; }
}
function viewSettings(){
  const s = state.settings;
  const storage = storageSize();
  return '<div class="view-head"><div><h1>Settings</h1><p class="view-sub">Preferences, data, shortcuts</p></div></div>' +
  '<section class="panel" aria-label="Preferences">' +
    '<div class="setting-block">' +
      '<h3>Appearance</h3><p class="desc">Theme follows your system by default. Color themes apply instantly and are remembered on this device.</p>' +
      '<div class="radio-row" role="radiogroup" aria-label="Theme">' +
        THEMES.map(t =>
          '<label class="radio-pill"><input type="radio" name="theme" value="' + t.id + '" data-change="theme"' + (s.theme === t.id ? ' checked' : '') + '><span>' + t.label + '</span></label>').join('') +
      '</div>' +
    '</div>' +
    '<div class="setting-block">' +
      '<h3>Weight unit</h3><p class="desc">Planned weights and the active workout are converted; logged history keeps the unit it was logged in.</p>' +
      '<div class="radio-row" role="radiogroup" aria-label="Unit">' +
        ['kg','lb'].map(u =>
          '<label class="radio-pill"><input type="radio" name="unit" value="' + u + '" data-change="unit"' + (s.unit === u ? ' checked' : '') + '><span>' + u + '</span></label>').join('') +
      '</div>' +
    '</div>' +
    '<div class="setting-block">' +
      '<h3>Rest timer</h3>' +
      '<div class="form-row">' +
        '<label class="field rest-field"><span class="cap">Default rest (seconds)</span>' +
        '<input type="number" min="' + REST_MIN + '" max="' + REST_MAX + '" step="15" inputmode="numeric" ' +
        'data-change="default-rest" value="' + s.defaultRest + '"></label>' +
      '</div>' +
      '<div class="switch-row">' +
        '<label for="sw-autorest"><strong>Auto-start after each set</strong><br><span class="hint">Uses the exercise’s rest time</span></label>' +
        '<span class="switch"><input type="checkbox" id="sw-autorest" data-change="setting" data-field="autoRest"' + (s.autoRest ? ' checked' : '') + '><span class="track" aria-hidden="true"></span></span>' +
      '</div>' +
      '<div class="switch-row">' +
        '<label for="sw-sound"><strong>Sound when rest ends</strong><br><span class="hint">Two short blips; completion is always announced to screen readers</span></label>' +
        '<span class="switch"><input type="checkbox" id="sw-sound" data-change="setting" data-field="sound"' + (s.sound ? ' checked' : '') + '><span class="track" aria-hidden="true"></span></span>' +
      '</div>' +
    '</div>' +
  '</section>' +
  '<section class="panel mt-4" aria-label="Data">' +
    '<div class="setting-block">' +
      '<h3>Data</h3><p class="desc">Stored locally in this browser (' + storage + '). Nothing is uploaded anywhere.</p>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn" data-action="export">' + IC.down + '<span>Export JSON</span></button>' +
        '<label class="file-btn"><span>' + IC.up + ' Import JSON</span><input type="file" accept=".json,application/json" data-change="import-all" aria-label="Import data from a JSON file"></label>' +
        '<button type="button" class="btn" data-action="load-samples">Load sample data</button>' +
      '</div>' +
    '</div>' +
    '<div class="setting-block">' +
      '<h3>Transfer routines &amp; history</h3>' +
      '<p class="desc">Move parts of your data between browsers. A routines file carries the exercises it needs — missing ones are added on import; duplicates are skipped.</p>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn" data-action="export-routines">' + IC.down + '<span>Routines JSON</span></button>' +
        '<label class="file-btn"><span>' + IC.up + ' Import routines</span><input type="file" accept=".json,application/json" data-change="import-routines" aria-label="Import routines from a JSON file"></label>' +
        '<button type="button" class="btn" data-action="export-history">' + IC.down + '<span>History JSON</span></button>' +
        '<label class="file-btn"><span>' + IC.up + ' Import history</span><input type="file" accept=".json,application/json" data-change="import-history" aria-label="Import workout history from a JSON file"></label>' +
      '</div>' +
    '</div>' +
    '<div class="setting-block">' +
      '<h3 class="danger-heading">Danger zone</h3>' +
      '<p class="desc">Removes every exercise, routine, workout and preference from this browser.</p>' +
      '<button type="button" class="btn btn-danger" data-action="clear-all">' + IC.trash + '<span>Clear all data…</span></button>' +
    '</div>' +
  '</section>' +
  '<section class="panel mt-4" aria-label="Keyboard shortcuts">' +
    '<div class="setting-block">' +
      '<h3>Keyboard shortcuts</h3><p class="desc">Disabled while typing in a field.</p>' +
      shortcutTable() +
    '</div>' +
  '</section>';
}

/* ============================================================
   EVENT HANDLING (delegated)
   ============================================================ */
const actions = {
  nav(d){ navigate(d.view); },
  'go-history'(){ navigate('history'); },
  'select-routine'(d){ ui.selectedRoutineId = d.id; render(); },
  'routine-start'(d){ startRoutine(d.id); },
  'start-empty'(){ startEmpty(); },
  'add-workout-exercise'(d){ addExerciseToWorkout(d.id); },

  'complete-current'(){ completeCurrentSet(); },
  'toggle-set'(d){ toggleSet(d.id); },
  'add-set'(){ addSet(); },
  'skip-exercise'(){ advanceExercise(true); },
  'next-exercise'(){ advanceExercise(false); },
  'reopen-exercise'(d){ reopenExercise(Number(d.idx)); },
  'toggle-done-ex'(d){
    const k = String(d.idx);
    ui.expandedDone.has(k) ? ui.expandedDone.delete(k) : ui.expandedDone.add(k);
    render();
  },
  'finish-workout'(){ finishWorkout(); },
  'discard-workout'(){ discardWorkout(); },

  'timer-preset'(d){ loadTimer(Number(d.sec)); toast('Rest set to ' + fmtClock(Number(d.sec))); },
  'timer-toggle'(){ toggleTimer(); },
  'timer-reset'(){ resetTimer(); },
  'timer-add30'(){ addThirty(); },

  'routine-new'(){ ui.routineDraft = newRoutineDraft(null); ui.routineError = ''; render(); },
  'routine-edit'(d){ const r = routineById(d.id); if (r){ ui.routineDraft = newRoutineDraft(r); ui.routineError=''; render(); } },
  'routine-dup'(d){ duplicateRoutine(d.id); },
  'routine-del'(d){ deleteRoutine(d.id); },
  'routine-cancel'(){ ui.routineDraft = null; ui.routineError=''; render(); },
  'ritem-up'(d){ moveRoutineItem(Number(d.idx), -1); },
  'ritem-down'(d){ moveRoutineItem(Number(d.idx), 1); },
  'ritem-rm'(d){ removeRoutineItem(Number(d.idx)); },
  'ritem-add'(){
    const sel = $('#routine-add-select');
    if (sel && sel.value) addRoutineItem(sel.value);
  },

  'ex-form-toggle'(){ ui.showExerciseForm = !ui.showExerciseForm; ui.exerciseFormError=''; render();
    if (ui.showExerciseForm){ const f = $('[data-form="ex-new"] input[name="exname"]'); if (f) f.focus(); } },
  'ex-form-close'(){ ui.showExerciseForm = false; ui.exerciseFormError=''; render(); },
  'ex-edit'(d){ const e = exerciseById(d.id); if (e){ ui.exerciseDraft = deepCopy(e); render(); } },
  'ex-edit-cancel'(){ ui.exerciseDraft = null; render(); },
  'ex-del'(d){ deleteExercise(d.id); },

  'history-toggle'(d){
    ui.expandedWorkouts.has(d.id) ? ui.expandedWorkouts.delete(d.id) : ui.expandedWorkouts.add(d.id);
    render();
  },
  'history-edit'(d){ ui.editWorkoutId = d.id; ui.expandedWorkouts.add(d.id); render(); },
  'history-edit-done'(){ ui.editWorkoutId = null; save(); render(); toast('Session updated'); },
  'hset-toggle'(d){
    const s = findHSet(d); if (!s) return;
    s.completed = !s.completed; s.completedAt = s.completed ? Date.now() : 0;
    save(); render();
  },
  'hset-del'(d){
    const ex = findHEx(d); if (!ex) return;
    ex.sets = ex.sets.filter(s => s.id !== d.sid);
    save(); render(); toast('Set removed');
  },
  'hset-add'(d){
    const ex = findHEx(d); if (!ex) return;
    const last = ex.sets[ex.sets.length - 1];
    const ns = { id:uid(),
      weight: last && last.weight != null ? last.weight : null,
      reps:   last && last.reps != null ? last.reps : null,
      durationSeconds: last && last.durationSeconds != null ? last.durationSeconds : null,
      rpe:    last && last.rpe != null ? last.rpe : null,
      completed:false, completedAt:0, unit: ex.unit || 'kg' };
    ex.sets.push(ns); save();
    ui.focus = 'hw-' + ns.id; render();
  },
  'hex-del'(d){
    const w = editingWorkout(); if (!w) return;
    const ex = w.exercises[Number(d.idx)]; if (!ex) return;
    confirmDlg('Remove exercise from this session?',
      '\u201C' + ex.name + '\u201D and its logged sets will be removed from this session only.', 'Remove', true)
      .then(ok => { if (!ok) return; w.exercises.splice(Number(d.idx), 1); save(); render(); toast('Exercise removed'); });
  },

  'export'(){ exportData(); },
  'export-routines'(){ exportRoutines(); },
  'export-history'(){ exportHistory(); },
  'clear-all'(){ clearAllData(); },
  'load-samples'(){ loadSamples(); },
  'help-open'(){ $('#help-dlg').showModal(); },
  'help-close'(){ $('#help-dlg').close(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset, el, e);
});

/* Live field binding — writes straight to state so the field keeps focus and
   the view is not rebuilt on every keystroke. Keyed by data-bind. */
const binders = {
  set(t){
    const ex = currentExercise(); if (!ex) return;
    const s = ex.sets.find(x => x.id === t.dataset.id); if (!s) return;
    s[t.dataset.field] = toNum(t.value);
    save();
  },
  wnotes(t){
    if (state.activeWorkout){ state.activeWorkout.notes = t.value; save(); }
  },
  rdraft(t){ if (ui.routineDraft) ui.routineDraft[t.dataset.field] = t.value; },
  ritem(t){
    if (!ui.routineDraft) return;
    const it = ui.routineDraft.items[Number(t.dataset.idx)]; if (!it) return;
    /* weight is optional (null = "whatever is on the bar"); the rest are counts */
    it[t.dataset.field] = t.dataset.field === 'weight' ? toNum(t.value) : (toNum(t.value) || 0);
  },
  edraft(t){ if (ui.exerciseDraft) ui.exerciseDraft[t.dataset.field] = t.value; },
  hwo(t){ const w = editingWorkout(); if (w){ w[t.dataset.field] = t.value; save(); } },
  hex(t){ const ex = findHEx(t.dataset); if (ex){ ex[t.dataset.field] = t.value; save(); } },
  hset(t){ const s = findHSet(t.dataset); if (s){ s[t.dataset.field] = toNum(t.value); save(); } },
  exfilter(t){ ui.exerciseFilter = t.value; ui.focus = 'ex-search'; render(); }
};
document.addEventListener('input', e => {
  const t = e.target;
  const fn = t.dataset && binders[t.dataset.bind];
  if (fn) fn(t);
});

/* Controls that commit on change rather than per keystroke. Keyed by data-change. */
const changeHandlers = {
  hexsel(t){ const ex = findHEx(t.dataset); if (ex){ ex.unit = t.value; save(); } },
  theme(t){ setTheme(t.value); },
  unit(t){ setUnit(t.value); },
  trend(t){ ui.trendExId = t.value; render(); },
  setting(t){
    const key = t.dataset.field;
    state.settings[key] = t.checked;
    save();
    toast((key === 'autoRest' ? 'Auto-rest ' : 'Timer sound ') + (t.checked ? 'on' : 'off'));
  },
  'default-rest'(t){
    const v = clamp(Math.round(toNum(t.value) || defaultSettings().defaultRest), REST_MIN, REST_MAX);
    state.settings.defaultRest = v; t.value = v; save();
    if (!state.activeWorkout) loadTimer(v);
    toast('Default rest: ' + fmtClock(v));
  },
  'workout-time'(t){
    const w = editingWorkout(); if (!w) return;
    const field = t.dataset.field;                 /* startedAt | finishedAt */
    const ts = new Date(t.value).getTime();
    if (isNaN(ts)){ toast('Invalid date — change discarded'); t.value = toLocalInput(w[field]); return; }
    w[field] = ts;
    sortWorkouts();                                /* a new start time can reorder history */
    save(); render();
    toast(field === 'startedAt' ? 'Start time updated' : 'End time updated');
  },
  'import-all'(t){ withPickedFile(t, importData); },
  'import-routines'(t){ withPickedFile(t, importRoutines); },
  'import-history'(t){ withPickedFile(t, importHistory); }
};
/* file inputs are reset so re-picking the same file fires change again */
function withPickedFile(input, fn){
  const file = input.files && input.files[0];
  input.value = '';
  if (file) fn(file);
}
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset) return;
  const fn = changeHandlers[t.dataset.change] || (t.dataset.bind === 'hexsel' ? changeHandlers.hexsel : null);
  if (fn) fn(t);
});
document.addEventListener('submit', e => {
  const form = e.target;
  const kind = form.dataset && form.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (kind === 'routine-save'){ saveRoutineDraft(); }
  else if (kind === 'add-workout-exercise'){
    const sel = $('#add-ex-select');
    if (sel && sel.value) addExerciseToWorkout(sel.value);
  }
  else if (kind === 'ex-new'){
    const g = n => { const el = form.elements.namedItem(n); return el ? el.value : ''; };
    saveNewExercise({ name:g('exname'), category:g('excat'), unit:g('exunit'), notes:g('exnotes') });
  }
  else if (kind === 'ex-save'){ saveExerciseDraft(); }
});


/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && (t.matches && t.matches('input, textarea, select, [contenteditable="true"]'));
  const dlgOpen = $('#dlg').open || $('#help-dlg').open;

  if (e.key === 'Escape'){
    if (dlgOpen) return; /* native dialog handles it */
    if (ui.routineDraft){ ui.routineDraft = null; ui.routineError=''; render(); }
    else if (ui.exerciseDraft){ ui.exerciseDraft = null; render(); }
    else if (ui.showExerciseForm){ ui.showExerciseForm = false; render(); }
    return;
  }
  if (typing || dlgOpen || e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key === '?'){ e.preventDefault(); $('#help-dlg').showModal(); return; }
  const k = e.key.toLowerCase();
  if (NAV_KEYS[k]){ navigate(NAV_KEYS[k]); return; }
  switch(k){
    case '/':
      e.preventDefault();
      ui.focus = 'ex-search';
      navigate('exercises');
      break;
    case 's':
      if (ui.view === 'routines' && ui.routineDraft){ saveRoutineDraft(); }
      else if (ui.view === 'exercises' && ui.exerciseDraft){ saveExerciseDraft(); }
      else if (ui.view === 'today' && !state.activeWorkout){
        const id = ui.selectedRoutineId || (state.routines[0] && state.routines[0].id);
        if (id) startRoutine(id);
      }
      break;
    case 'c':
      if (state.activeWorkout && ui.view === 'today') completeCurrentSet();
      break;
    case 'n':
      if (state.activeWorkout && ui.view === 'today') advanceExercise(false);
      break;
    case ' ':
      if (state.activeWorkout){ e.preventDefault(); toggleTimer(); }
      break;
  }
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  applyTheme();
  /* restoreTimer() reads activeWorkout.timer, and loadTimer() overwrites it —
     so a running rest timer must be restored instead of, not after, a reset. */
  if (state.activeWorkout) restoreTimer();
  else loadTimer(state.settings.defaultRest);

  $('#app-version').textContent = 'Liftlog v' + APP_VERSION;
  $('#help-shortcuts').innerHTML = shortcutTable();

  save();            /* persist the seed so a first visit survives a reload */
  render();
  setInterval(tickTimer, 250);

  if (state.activeWorkout) announce('Active workout restored: ' + state.activeWorkout.routineName);
  if (loadWarning) toast(loadWarning);
}
init();
})();
</script>
