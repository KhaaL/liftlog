<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Liftlog — a quiet, local-first gym workout tracker. Log sets, time rests, review progress.">
<meta name="color-scheme" content="light dark">
<title>Liftlog — Gym Workout Tracker</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#fbfbf9;
  --surface:#ffffff;
  --surface-2:#f2f2ee;
  --text:#20242a;
  --muted:#616a76;
  --border:#dcdcd5;
  --border-strong:#c3c3ba;
  --accent:#2b5fd9;
  --accent-strong:#2b5fd9;
  --on-accent:#ffffff;
  --accent-soft:#e9effc;
  --danger:#b3271e;
  --danger-strong:#b3271e;
  --danger-soft:#faeae8;
  --success:#1e7a44;
  --success-soft:#e4f3ea;
  --warning:#8a5800;
  --warning-soft:#f9efd9;
  --focus:#2b5fd9;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --fs-xs:11.5px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px;
  --radius-sm:4px; --radius:6px; --radius-lg:10px;
  --shadow-sm:0 1px 2px rgb(32 36 42 / .06);
  --shadow-md:0 4px 14px rgb(32 36 42 / .10);

  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b;
    --surface:#1d2024;
    --surface-2:#24282d;
    --text:#e4e7ea;
    --muted:#9aa4ae;
    --border:#34393f;
    --border-strong:#4a5158;
    --accent:#8ab1f2;
    --accent-strong:#3d74d4;
    --on-accent:#ffffff;
    --accent-soft:#263349;
    --danger:#e07a70;
    --danger-strong:#a83a32;
    --danger-soft:#3a2422;
    --success:#5fc48c;
    --success-soft:#1f3329;
    --warning:#dfb45e;
    --warning-soft:#37301d;
    --focus:#8ab1f2;
    --shadow-sm:0 1px 2px rgb(0 0 0 / .35);
    --shadow-md:0 4px 14px rgb(0 0 0 / .45);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b;
  --surface:#1d2024;
  --surface-2:#24282d;
  --text:#e4e7ea;
  --muted:#9aa4ae;
  --border:#34393f;
  --border-strong:#4a5158;
  --accent:#8ab1f2;
  --accent-strong:#3d74d4;
  --on-accent:#ffffff;
  --accent-soft:#263349;
  --danger:#e07a70;
  --danger-strong:#a83a32;
  --danger-soft:#3a2422;
  --success:#5fc48c;
  --success-soft:#1f3329;
  --warning:#dfb45e;
  --warning-soft:#37301d;
  --focus:#8ab1f2;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .35);
  --shadow-md:0 4px 14px rgb(0 0 0 / .45);
}
/* community color themes */
:root[data-theme="dracula"]{
  --bg:#282a36; --surface:#2f3140; --surface-2:#383b4c;
  --text:#f8f8f2; --muted:#a9b0c6;
  --border:#44475a; --border-strong:#585c74;
  --accent:#bd93f9; --accent-strong:#b183f7; --on-accent:#282a36; --accent-soft:#3d3559;
  --danger:#ff5555; --danger-strong:#e04545; --danger-soft:#4b2b33;
  --success:#50fa7b; --success-soft:#23402e;
  --warning:#f1fa8c; --warning-soft:#454426;
  --focus:#bd93f9;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .35); --shadow-md:0 4px 14px rgb(0 0 0 / .45);
}
:root[data-theme="gruvbox"]{
  --bg:#282828; --surface:#32302f; --surface-2:#3c3836;
  --text:#ebdbb2; --muted:#a89984;
  --border:#504945; --border-strong:#665c54;
  --accent:#fe8019; --accent-strong:#f07312; --on-accent:#282828; --accent-soft:#4d3a26;
  --danger:#fb4934; --danger-strong:#d83a27; --danger-soft:#4b2a25;
  --success:#b8bb26; --success-soft:#3c3d21;
  --warning:#fabd2f; --warning-soft:#4b4122;
  --focus:#fe8019;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .35); --shadow-md:0 4px 14px rgb(0 0 0 / .45);
}
:root[data-theme="nord"]{
  --bg:#2e3440; --surface:#353c49; --surface-2:#3b4252;
  --text:#eceff4; --muted:#a6b1c2;
  --border:#434c5e; --border-strong:#546076;
  --accent:#88c0d0; --accent-strong:#79b4c6; --on-accent:#2e3440; --accent-soft:#3a4a55;
  --danger:#bf616a; --danger-strong:#ad5059; --danger-soft:#45333c;
  --success:#a3be8c; --success-soft:#394230;
  --warning:#ebcb8b; --warning-soft:#4a4230;
  --focus:#88c0d0;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .35); --shadow-md:0 4px 14px rgb(0 0 0 / .45);
}
:root[data-theme="solarized"]{
  --bg:#002b36; --surface:#073642; --surface-2:#0c4250;
  --text:#eee8d5; --muted:#90a4a6;
  --border:#135060; --border-strong:#1e6477;
  --accent:#268bd2; --accent-strong:#2380c2; --on-accent:#ffffff; --accent-soft:#0d3f56;
  --danger:#e5544f; --danger-strong:#c42b28; --danger-soft:#42232b;
  --success:#b3c63a; --success-soft:#323f17;
  --warning:#d9a921; --warning-soft:#423617;
  --focus:#268bd2;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .4); --shadow-md:0 4px 14px rgb(0 0 0 / .5);
}
:root[data-theme="monokai"]{
  --bg:#272822; --surface:#2e2f28; --surface-2:#36382f;
  --text:#f8f8f2; --muted:#a7a396;
  --border:#49483e; --border-strong:#5f5d4f;
  --accent:#66d9ef; --accent-strong:#4fcbe4; --on-accent:#272822; --accent-soft:#2b4548;
  --danger:#f92672; --danger-strong:#e01f63; --danger-soft:#4b2536;
  --success:#a6e22e; --success-soft:#39451e;
  --warning:#e6db74; --warning-soft:#474325;
  --focus:#66d9ef;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .35); --shadow-md:0 4px 14px rgb(0 0 0 / .45);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:var(--fs-base); line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
::selection{ background:var(--accent-soft); }
h1,h2,h3{ font-weight:650; line-height:1.2; margin:0; letter-spacing:-.01em; }
h1{ font-size:var(--fs-xl); }
h2{ font-size:var(--fs-lg); }
h3{ font-size:var(--fs-md); }
p{ margin:0; }
ul,ol{ margin:0; padding:0; list-style:none; }
button{ font:inherit; color:inherit; }
svg{ display:block; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--muted); }
.small{ font-size:var(--fs-sm); }
.xs{ font-size:var(--fs-xs); }
strong{ font-weight:650; }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip-link{
  position:absolute; left:var(--sp-4); top:-60px; z-index:100;
  background:var(--accent-strong); color:var(--on-accent);
  padding:var(--sp-2) var(--sp-4); border-radius:var(--radius);
  text-decoration:none; font-weight:600; transition:top .15s ease;
}
.skip-link:focus{ top:var(--sp-3); }

:focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--radius-sm);
}

.wrap{ max-width:920px; margin:0 auto; padding:0 var(--sp-4); }

/* ============================================================
   HEADER / NAV
   ============================================================ */
.app-header{
  border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:20;
}
.header-inner{ display:flex; align-items:center; gap:var(--sp-5); min-height:52px; flex-wrap:wrap; padding-top:var(--sp-1); padding-bottom:var(--sp-1); }
.wordmark{
  font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:.01em;
  display:flex; align-items:center; gap:8px; margin:0; user-select:none;
}
.wordmark .mark{ color:var(--accent); }
.main-nav ul{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.main-nav ul::-webkit-scrollbar{ display:none; }
.nav-btn{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  padding:14px var(--sp-3) 12px; font-size:var(--fs-sm); font-weight:550; color:var(--muted);
  cursor:pointer; white-space:nowrap; transition:color .12s ease, border-color .12s ease;
}
.nav-btn:hover{ color:var(--text); }
.nav-btn[aria-current="page"]{ color:var(--text); border-bottom-color:var(--accent); font-weight:650; }
.nav-btn .dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--success); margin-left:6px; vertical-align:1px;
}

/* ============================================================
   LAYOUT HELPERS
   ============================================================ */
main{ padding-top:var(--sp-5); padding-bottom:var(--sp-7); min-height:70vh; }
.view-head{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-4); flex-wrap:wrap; margin-bottom:var(--sp-5); }
.view-head h1{ font-family:var(--font-display); font-weight:700; }
.view-sub{ color:var(--muted); font-size:var(--fs-sm); }
.section-title{ display:flex; align-items:center; gap:var(--sp-3); margin:var(--sp-6) 0 var(--sp-3); }
.section-title h2{ font-family:var(--font-display); font-weight:700; font-size:var(--fs-md); }
.section-title .rule{ flex:1; border-top:1px solid var(--border); }
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.panel + .panel{ margin-top:var(--sp-4); }
.pad{ padding:var(--sp-4); }

/* ============================================================
   BUTTONS / INPUTS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:38px; padding:var(--sp-2) var(--sp-4);
  background:var(--surface); color:var(--text);
  border:1px solid var(--border-strong); border-radius:var(--radius);
  font-size:var(--fs-sm); font-weight:600; cursor:pointer; text-decoration:none;
  transition:background .12s ease, border-color .12s ease, transform .05s ease;
  user-select:none;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn-primary{ background:var(--accent-strong); border-color:var(--accent-strong); color:var(--on-accent); }
.btn-primary:hover{ background:var(--accent-strong); filter:brightness(1.07); }
.btn-danger{ color:var(--danger); border-color:var(--border-strong); }
.btn-danger:hover{ background:var(--danger-soft); border-color:var(--danger); }
.btn-danger-solid{ background:var(--danger-strong); border-color:var(--danger-strong); color:#fff; }
.btn-danger-solid:hover{ filter:brightness(1.07); background:var(--danger-strong); }
.btn-quiet{ border-color:transparent; background:transparent; color:var(--muted); }
.btn-quiet:hover{ background:var(--surface-2); color:var(--text); }
.btn-big{ min-height:52px; font-size:var(--fs-md); padding:var(--sp-3) var(--sp-5); border-radius:8px; }
.btn-sm{ min-height:30px; padding:3px var(--sp-3); font-size:var(--fs-xs); }
.btn .ic{ width:15px; height:15px; flex:none; }

.field{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.field > .cap{
  font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
}
input[type="text"],input[type="number"],input[type="search"],input[type="datetime-local"],select,textarea{
  font:inherit; font-size:var(--fs-sm); color:var(--text);
  background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius);
  padding:8px 10px; min-height:38px; width:100%; min-width:0;
  transition:border-color .12s ease, background .12s ease;
}
textarea{ resize:vertical; min-height:64px; }
input:hover,select:hover,textarea:hover{ border-color:var(--muted); }
input:focus,select:focus,textarea:focus{ outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus); }
input[type="number"]{ font-variant-numeric:tabular-nums; }
input::placeholder,textarea::placeholder{ color:var(--muted); opacity:.7; }
select{ appearance:none; padding-right:30px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%; background-size:5px 5px; background-repeat:no-repeat; }

.form-row{ display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:flex-end; }
.form-row .field{ flex:1; min-width:120px; }
.form-actions{ display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; }
.form-footer{ margin-top:var(--sp-5); padding-top:var(--sp-4); border-top:1px solid var(--border); }
.error-text{ color:var(--danger); font-size:var(--fs-sm); font-weight:600; }
.hint{ color:var(--muted); font-size:var(--fs-xs); }

kbd{
  font-family:var(--font-mono); font-size:12px;
  background:var(--surface-2); border:1px solid var(--border-strong); border-bottom-width:2px;
  border-radius:var(--radius-sm); padding:1px 6px; color:var(--text);
}

/* --- small layout utilities (used by the view templates) --- */
.mt-2{ margin-top:var(--sp-2); }
.mt-3{ margin-top:var(--sp-3); }
.mt-4{ margin-top:var(--sp-4); }
.mt-5{ margin-top:var(--sp-5); }
.mb-3{ margin-bottom:var(--sp-3); }
.mb-4{ margin-bottom:var(--sp-4); }
.flex-2{ flex:2; }
.flex-none{ flex:0 0 auto; }
.push-right{ margin-left:auto; }
.self-end{ justify-self:end; }
.span-all{ grid-column:1 / -1; }
.divider-top{ border-top:1px solid var(--border); }
.panel-title{ font-family:var(--font-display); font-size:var(--fs-md); }
.quote{ font-style:italic; }
.key-hint{ opacity:.75; }
.ic-xs{ width:11px; height:11px; display:inline-block; vertical-align:-1px; }
.ic-inline{ display:inline-block; vertical-align:-2px; }

/* ============================================================
   TODAY — PICKER
   ============================================================ */
.routine-pick{ display:flex; flex-direction:column; gap:var(--sp-2); }
.routine-pick-row{
  display:flex; align-items:center; gap:var(--sp-3);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:var(--sp-2) var(--sp-3) var(--sp-2) 0;
  transition:border-color .12s ease, background .12s ease;
}
.routine-pick-row:hover{ border-color:var(--border-strong); background:var(--surface-2); }
.routine-pick-row.is-selected{ border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); }
/* the label fills the row so the whole card is a selection target */
.rp-select{
  flex:1; min-width:0; text-align:left; background:none; border:0; cursor:pointer;
  padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4); border-radius:var(--radius);
}
.rp-name{ font-weight:650; display:block; }
.rp-meta{ color:var(--muted); font-size:var(--fs-xs); display:block; }
.rp-go{ flex:none; }
.last-session-row{ display:flex; gap:var(--sp-3); align-items:baseline; flex-wrap:wrap; }
.last-session{ border-left:3px solid var(--success); }

/* ============================================================
   ACTIVE WORKOUT
   ============================================================ */
.workout-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:var(--sp-4); flex-wrap:wrap; }
.workout-title{ font-family:var(--font-display); font-size:var(--fs-xl); font-weight:700; }
.workout-meta{ color:var(--muted); font-size:var(--fs-sm); display:flex; gap:var(--sp-3); flex-wrap:wrap; margin-top:2px; }
.workout-head-actions{ display:flex; gap:var(--sp-2); flex-wrap:wrap; }

.progress-line{ margin-top:var(--sp-3); }
.progress-track{ height:5px; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }
.progress-label{ font-size:var(--fs-xs); color:var(--muted); margin-top:var(--sp-1); font-variant-numeric:tabular-nums; }

.ex-panel{ border-color:var(--accent); border-top:3px solid var(--accent); }
.ex-head{ display:flex; justify-content:space-between; gap:var(--sp-3); align-items:baseline; flex-wrap:wrap; }
.ex-name{ font-family:var(--font-display); font-size:var(--fs-lg); font-weight:700; }
.ex-tags{ display:flex; gap:var(--sp-2); flex-wrap:wrap; }
.tag{
  font-size:var(--fs-xs); font-weight:650; padding:2px 8px; border-radius:99px;
  border:1px solid var(--border-strong); color:var(--muted); background:var(--surface-2);
}
.prev-perf{
  margin-top:var(--sp-3); padding:var(--sp-2) var(--sp-3);
  background:var(--surface-2); border-radius:var(--radius); border:1px solid var(--border);
  font-size:var(--fs-sm); color:var(--muted); display:flex; gap:var(--sp-4); flex-wrap:wrap;
}
.prev-perf strong{ color:var(--text); font-variant-numeric:tabular-nums; }
.prev-perf .pp-item{ display:flex; gap:6px; align-items:baseline; }
.prev-perf .pp-k{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; font-weight:650; }
.ex-notes{ margin-top:var(--sp-3); font-size:var(--fs-sm); color:var(--muted); font-style:italic; }

/* sets table */
.sets-head,.set-row{
  display:grid; grid-template-columns:52px 1fr 1fr 76px 96px; gap:var(--sp-2); align-items:end;
}
.sets-head{ padding:0 2px var(--sp-1); }
.sets-head span{ font-size:10.5px; font-weight:650; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.set-row{ padding:var(--sp-2) 0; border-top:1px solid var(--border); }
.set-row.is-current{ background:var(--accent-soft); margin:0 calc(-1 * var(--sp-3)); padding-left:var(--sp-3); padding-right:var(--sp-3); border-radius:var(--radius); border-top-color:transparent; }
.set-row.is-done .n,.set-row.is-done input{ color:var(--muted); }
.set-row.is-done input{ background:var(--surface-2); border-color:var(--border); }
.set-num{ display:flex; flex-direction:column; justify-content:center; gap:1px; padding-bottom:8px; }
.set-num .n{ font-weight:700; font-variant-numeric:tabular-nums; font-size:var(--fs-md); line-height:1; }
.set-num .prev{ font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.2; }
.set-done-btn{ min-height:44px; min-width:44px; padding-inline:10px; justify-content:center; font-size:var(--fs-xs); }
.set-done-btn[aria-pressed="true"]{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
.sets-foot{ display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3); padding-top:var(--sp-3); border-top:1px solid var(--border); }

/* history session editor */
.hedit{ border:1px solid var(--border-strong); }
.hedit-bar{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-4); }
.hedit-hint{ flex:1; text-align:right; }
.hedit-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:var(--sp-3); }
.hedit-ex{ border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp-3); margin-top:var(--sp-3); }
.hedit-ex-head{ display:flex; gap:var(--sp-3); align-items:flex-end; flex-wrap:wrap; }
.hset-row{ display:grid; grid-template-columns:20px 1fr 1fr 1fr auto; gap:var(--sp-2); align-items:end; margin-top:var(--sp-3); }
.hset-num{ padding-bottom:9px; text-align:center; }
.hset-ctl{ display:flex; gap:var(--sp-2); }
.hset-done,.hset-del{ min-height:44px; min-width:44px; padding-inline:9px; justify-content:center; }
.hset-done[aria-pressed="true"]{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
.hset-del{ color:var(--muted); }
.hset-del:hover{ color:var(--danger); border-color:var(--danger); }
.hset-row.done .field input{ opacity:.55; }
@media (max-width:620px){
  .hset-row{ grid-template-columns:1fr 1fr 1fr; }
  .hset-num{ display:none; }
  .hset-ctl{ grid-column:1 / -1; justify-content:flex-end; }
}

.sticky-actions{
  position:sticky; bottom:0; z-index:15;
  display:flex; gap:var(--sp-2);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md); padding:var(--sp-3);
  margin-top:var(--sp-4);
  padding-bottom:calc(var(--sp-3) + env(safe-area-inset-bottom));
}
.sticky-actions .btn-primary{ flex:1; }

.done-ex-row{

.done-ex-detail .dset{ display:flex; gap:var(--sp-3); padding:3px 0; font-variant-numeric:tabular-nums; }
.status-chip{ font-size:var(--fs-xs); font-weight:650; padding:1px 8px; border-radius:99px; }
.status-chip.ok{ background:var(--success-soft); color:var(--success); }

/* ============================================================
   REST TIMER
   ============================================================ */
.timer{ margin-top:var(--sp-4); }
.timer-top{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; margin-bottom:var(--sp-2); }
.timer-label{ font-size:var(--fs-xs); font-weight:650; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:6px; }
.presets{ display:flex; gap:6px; flex-wrap:wrap; }
.preset-btn{
  min-height:34px; padding:2px var(--sp-3); font-size:var(--fs-xs); font-weight:650;
  border:1px solid var(--border-strong); border-radius:99px; background:var(--surface);

  transition:all .12s ease;
}
.preset-btn:hover{ color:var(--text); border-color:var(--muted); }
.preset-btn[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

.timer-time{ font-family:var(--font-mono); font-size:44px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em; min-width:130px; }
.timer.is-running .timer-time{ color:var(--accent); }
.timer.is-done .timer-time{ color:var(--success); }
.timer.is-done{ border-color:var(--success); }
.timer-controls{ display:flex; gap:var(--sp-2); flex-wrap:wrap; }
.timer-track{ height:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; overflow:hidden; margin-top:var(--sp-3); }
.timer-fill{ height:100%; width:100%; background:var(--accent); transition:width .25s linear; }
.timer.is-done .timer-fill{ background:var(--success); }
.timer-status{ margin-top:var(--sp-2); font-size:var(--fs-sm); color:var(--muted); }

.list-name{ font-weight:650; }
.list-meta{ color:var(--muted); font-size:var(--fs-xs); margin-top:1px; }
.list-actions{ display:flex; gap:6px; flex-wrap:wrap; }

.hist-row{ width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--border); cursor:pointer; padding:var(--sp-3) var(--sp-4); display:grid; grid-template-columns:minmax(150px,1.2fr) 2fr repeat(3,minmax(70px,1fr)) 24px; gap:var(--sp-3); align-items:baseline; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:var(--sp-3); }

}

}

   ============================================================ */
const APP_VERSION = '1.0.0';       /* shown in the footer */
const LS_KEY = 'liftlog.v1';
const LS_RESCUE_KEY = 'liftlog.v1.unreadable';  /* holds data we could not load, so nothing is lost silently */
const SCHEMA_VERSION = 3;   /* v3: sets carry durationSeconds (time no longer overloads reps)
                               + countForVolume / countForPR split execution from analytics */
const EXPORT_SCHEMA = '1.0.0'; /* version of the documented import/export contract */

/* Set by load() when stored data could not be used, surfaced once after init. */
let loadWarning = '';

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ /* storage full or unavailable — app keeps working in memory */ }
}
/* Stored data we cannot read is never overwritten in place: it is moved aside
   first so a bad parse or a downgrade can still be recovered by hand. */
function rescueUnreadable(raw, why){
  loadWarning = why;
  try{ if (raw) localStorage.setItem(LS_RESCUE_KEY, raw); }catch(e){ /* nothing more we can do */ }
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){ return seedState(); }
  if (!raw) return seedState();
  let parsed = null;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    rescueUnreadable(raw, 'Saved data could not be read and was set aside; starting fresh.');
    return seedState();
  }
  if (!parsed || !Array.isArray(parsed.exercises) || !(parsed.version >= 1)){
    rescueUnreadable(raw, 'Saved data was not in a recognizable shape and was set aside; starting fresh.');
    return seedState();
  }
  if (parsed.version > SCHEMA_VERSION){
    rescueUnreadable(raw, 'Saved data comes from a newer version of Liftlog and was set aside rather than downgraded.');
    return seedState();
  }
  if (parsed.version === 1) migrateToV2(parsed);   /* old installs: swap in the program, keep history */
  if (parsed.version === 2) migrateToV3(parsed);   /* v2 stored seconds in `reps` for timed sets */
  return normalizeState(parsed);
}
/* v1 stored generic sample exercises/routines. v2 ships the real program,
   so replace the library and routines but keep logged workouts and prefs. */
function migrateToV2(s){
  s.exercises = sampleExercises();
  s.routines = sampleRoutines(s.exercises);
  s.version = 2;
}
/* v2 timed sets abused `reps` to hold seconds. v3 gives them durationSeconds
   and keeps `reps` a pure integer count, so rep aggregates stay correct. */
function migrateToV3(s){
  const fix = w => (w && Array.isArray(w.exercises)) && w.exercises.forEach(ex => {
    const exTime = ex.unit === 'time';
    (ex.sets || []).forEach(set => {
      const time = set.unit === 'time' || (exTime && set.unit == null);
      if (time && set.durationSeconds == null){
        set.durationSeconds = set.reps != null ? Number(set.reps) : null;
        set.reps = null;
      }
      set.unit = set.unit || ex.unit || 'kg';
    });
  });
  (s.workouts || []).forEach(fix);
  fix(s.activeWorkout);
  s.version = 3;
}
/* Anything reachable from disk or an import file gets clamped to a known value
   here, so the render layer never has to defend against stray strings. */
function normalizeState(s){
  const d = defaultSettings();
  const set = Object.assign(d, s.settings || {});
  set.theme = THEMES.some(t => t.id === set.theme) ? set.theme : d.theme;
  set.unit = set.unit === 'lb' ? 'lb' : 'kg';
  set.defaultRest = clamp(Math.round(toNum(set.defaultRest) || d.defaultRest), REST_MIN, REST_MAX);
  set.autoRest = !!set.autoRest;
  set.sound = !!set.sound;
  s.settings = set;
  s.exercises = (s.exercises || []).map(e => Object.assign({}, e, {
    category: typeof e.category === 'string' ? e.category : '',
    unit: isUnit(e.unit) ? e.unit : 'kg',
    notes: typeof e.notes === 'string' ? e.notes : ''
  }));
  s.routines  = s.routines || [];
  s.workouts  = s.workouts || [];
  s.activeWorkout = s.activeWorkout || null;
  sortWorkouts(s.workouts);
  return s;
}
function defaultSettings(){
  return { theme:'system', unit:'kg', defaultRest:90, autoRest:true, sound:true };
}
/* History is kept newest-first everywhere; every mutation that can change a
   start time re-establishes that instead of sorting again at each read. */
function sortWorkouts(list){
  (list || state.workouts).sort((a,b) => b.startedAt - a.startedAt);
}

/* ============================================================
   FEEDBACK: toast + live announcements + confirm dialog
   ============================================================ */
/* #toast-region is aria-live, so a toast is already announced to screen
   readers. announce() is only for feedback that has no visible toast. */
function toast(msg){
  const region = $('#toast-region');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  region.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2400);
}
function announce(msg){
  const el = $('#live');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 60);
}
function dialog(opts){
  /* opts: {title, body, buttons:[{label, value, cls, autofocus}]} -> Promise<value|null> */
  const dlg = $('#dlg');
  $('#dlg-title').textContent = opts.title;
  $('#dlg-body').textContent = opts.body;
  const actions = $('#dlg-actions');
  actions.innerHTML = '';
  (opts.buttons || [{label:'OK', value:true, cls:'btn-primary'}]).forEach(b => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn ' + (b.cls || '');
    btn.textContent = b.label;
    if (b.autofocus) btn.setAttribute('data-autofocus','1');
    btn.addEventListener('click', () => { dlg._val = b.value; dlg.close(); });
    actions.appendChild(btn);
  });
  return new Promise(res => {
    dlg.addEventListener('close', function h(){
      dlg.removeEventListener('close', h);
      const v = dlg._val !== undefined ? dlg._val : null;
      dlg._val = undefined;
      res(v);
    });
    dlg.showModal();
    const af = $('[data-autofocus]', dlg) || $('button', actions);
    if (af) af.focus();
  });
}
function confirmDlg(title, body, confirmLabel, danger){
  return dialog({ title, body, buttons:[
    { label:'Cancel', value:false, cls:'', autofocus:true },
    { label:confirmLabel || 'Confirm', value:true, cls: danger ? 'btn-danger-solid' : 'btn-primary' }
  ]});
}

/* ============================================================
   REST TIMER  (kept in module scope; persisted on activeWorkout)
   ============================================================ */
const timer = { seconds:90, remaining:90, running:false, endsAt:0, done:false };

function persistTimer(){
  if (state.activeWorkout){
    state.activeWorkout.timer = {
      seconds:timer.seconds, remaining:Math.round(timer.remaining),
      running:timer.running, endsAt:timer.endsAt
    };
    save();
  }
}
function restoreTimer(){
  const t = state.activeWorkout && state.activeWorkout.timer;
  timer.running = false; timer.done = false;
  timer.seconds = (t && t.seconds) || state.settings.defaultRest;
  timer.remaining = (t && (t.remaining != null ? t.remaining : t.seconds)) || timer.seconds;
  if (t && t.running && t.endsAt){
    const rem = (t.endsAt - Date.now()) / 1000;
    if (rem > 0){ timer.remaining = rem; timer.endsAt = t.endsAt; timer.running = true; }
    else { timer.remaining = 0; timer.done = true; }
  }
}
function loadTimer(sec){
  timer.seconds = sec || state.settings.defaultRest;
  timer.remaining = timer.seconds;
  timer.running = false; timer.done = false;
  persistTimer(); drawTimer();
}
function startTimer(){
  if (timer.remaining <= 0){ timer.remaining = timer.seconds; timer.done = false; }
  timer.endsAt = Date.now() + timer.remaining * 1000;
  timer.running = true;
  persistTimer(); drawTimer();
}
function pauseTimer(){
  if (timer.running){ timer.remaining = Math.max(0, (timer.endsAt - Date.now())/1000); }
  timer.running = false;
  persistTimer(); drawTimer();
}
function resetTimer(){
  timer.running = false; timer.done = false;
  timer.remaining = timer.seconds;
  persistTimer(); drawTimer();
}
function addThirty(){
  timer.seconds += 30; timer.remaining += 30;
  if (timer.running) timer.endsAt += 30000;
  timer.done = false;
  persistTimer(); drawTimer();
}
function toggleTimer(){
  if (!state.activeWorkout) return;
  if (timer.done){ loadTimer(currentRestSeconds()); startTimer(); return; }
  timer.running ? pauseTimer() : startTimer();
  announce(timer.running ? 'Rest timer started' : 'Rest timer paused');
}
function currentRestSeconds(){
  const w = state.activeWorkout;
  if (w){
    const ex = w.exercises[w.currentExerciseIndex];
    if (ex && ex.restSeconds) return ex.restSeconds;
  }
  return state.settings.defaultRest;
}
function timerRemaining(){
  return timer.running ? Math.max(0, (timer.endsAt - Date.now())/1000) : timer.remaining;
}
/* Cheap path, runs four times a second: only the numbers that actually move. */
function paintTimerTime(){
  const timeEl = $('#timer-time');
  if (!timeEl) return;
  const rem = timerRemaining();
  timeEl.textContent = fmtClock(rem);
  const fill = $('#timer-fill');
  if (fill) fill.style.width = (timer.seconds > 0 ? Math.min(100, rem/timer.seconds*100) : 0) + '%';
}
/* Full repaint, runs on state transitions and after every render. */
function drawTimer(){
  const timeEl = $('#timer-time');
  if (!timeEl) return;
  paintTimerTime();
  const rem = timerRemaining();
  const panel = $('#timer-panel');
  const status = $('#timer-status');
  const toggle = $('#timer-toggle');
  if (panel){
    panel.classList.toggle('is-running', timer.running);
    panel.classList.toggle('is-done', timer.done);
  }
  if (status){
    status.textContent = timer.done ? 'Rest complete — start your next set.'
      : timer.running ? 'Resting… press space to pause.'
      : (rem < timer.seconds ? 'Paused.' : 'Ready. Timer starts after each completed set.');
  }
  if (toggle){
    toggle.innerHTML = (timer.running ? IC.pause : IC.play) + '<span>' +
      (timer.running ? 'Pause' : (rem < timer.seconds && !timer.done ? 'Resume' : 'Start')) + '</span>';
    toggle.setAttribute('aria-label', timer.running ? 'Pause rest timer' : 'Start rest timer');
  }
  $$('.preset-btn').forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.sec) === timer.seconds)));
}
function tickTimer(){
  if (!state.activeWorkout && !timer.running) return;
  if (timer.running){
    if ((timer.endsAt - Date.now())/1000 <= 0){
      timer.running = false; timer.remaining = 0; timer.done = true;
      persistTimer();
      announce('Rest complete.');
      beep();
      drawTimer();          /* transition: repaint labels and panel state */
    } else {
      paintTimerTime();
    }
  }
  /* keep elapsed workout time fresh */
  const el = $('#workout-elapsed');
  if (el && state.activeWorkout) el.textContent = fmtDuration(Date.now() - state.activeWorkout.startedAt);
}
let audioCtx = null;
function beep(){
  if (!state.settings.sound) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    const ctx = audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const blip = (t0, f) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.start(t0); o.stop(t0 + 0.4);
    };
    blip(ctx.currentTime, 880);
    blip(ctx.currentTime + 0.28, 1175);
  }catch(e){ /* audio unavailable — visual announcement still happens */ }
}

/* ============================================================
   PERFORMANCE LOOKUPS (previous session, bests)
   ============================================================ */
/* state.workouts is kept newest-first (see sortWorkouts), so this is just a
   readable name for that guarantee rather than a re-sort at every call. */
function sortedWorkouts(){ return state.workouts; }

/* Every "best" figure and the previous-session line come from one pass over
   history per exercise. The cache is per render — render() clears it — so the
   Today screen no longer walks the whole log five times to draw one panel. */
let statsCache = null;
function clearStatsCache(){ statsCache = null; }
function exerciseStats(exId){
  if (!statsCache) statsCache = new Map();
  const hit = statsCache.get(exId);
  if (hit) return hit;
  const out = { last:null, e1rm:0, duration:0, reps:0, volume:0 };
  for (const w of sortedWorkouts()){
    for (const ex of w.exercises){
      if (ex.exerciseId !== exId) continue;
      const completed = ex.sets.filter(s => s.completed);
      if (!out.last && completed.length) out.last = { date:w.startedAt, sets:completed };
      out.volume = Math.max(out.volume, sumVolume(ex.sets));
      for (const s of ex.sets){
        if (!countsPR(s)) continue;
        const weight = setWeight(s);
        if (weight > 0) out.e1rm = Math.max(out.e1rm, epley(weight, s.reps));
        const d = setDuration(s);
        if (d != null) out.duration = Math.max(out.duration, Number(d) || 0);
        out.reps = Math.max(out.reps, Number(s.reps) || 0);
      }
    }
  }
  statsCache.set(exId, out);
  return out;
}
const lastPerformance = exId => exerciseStats(exId).last;

const setDuration = s => s.durationSeconds != null ? s.durationSeconds : (s.unit === 'time' ? s.reps : null); /* reps fallback: pre-v3 data */
/* Returns escaped HTML: distanceUnit and unit can originate in an import file. */
function setSummary(s){
  if (s.distance != null) return fmtNum(s.distance) + ' ' + esc(s.distanceUnit || 'm');
  const dur = setDuration(s);
  if (s.unit === 'time' || dur != null) return (dur != null ? dur + ' s' : '–');
  if (s.unit === 'bw') return (s.reps != null ? s.reps + ' reps' : '–') + ' BW';
  return fmtNum(s.weight) + ' ' + esc(s.unit || 'kg') + ' × ' + (s.reps != null ? s.reps : '–');
}
function workoutVolume(w){ return w.exercises.reduce((a,ex) => a + sumVolume(ex.sets), 0); }
function workoutSets(w){ return w.exercises.reduce((a,ex) => a + ex.sets.filter(s => s.completed).length, 0); }
function workoutPlannedSets(w){ return w.exercises.reduce((a,ex) => a + ex.sets.length, 0); }
/* An imported session may have no end time; report that rather than showing 0. */
function workoutDuration(w){
  return (w.finishedAt && w.startedAt && w.finishedAt >= w.startedAt) ? w.finishedAt - w.startedAt : NaN;
}

/* ============================================================
   ACTIONS — active workout
   ============================================================ */
function newSetFrom(ex, copyFrom){
  const timed = ex.unit === 'time';
  return {
    id:uid(),
    weight: copyFrom ? copyFrom.weight : null,
    /* reps stays a pure count; timed work lives in durationSeconds */
    reps:   copyFrom ? (timed ? null : copyFrom.reps) : (!timed && ex.targetReps != null ? ex.targetReps : null),
    durationSeconds: copyFrom ? (timed ? copyFrom.durationSeconds : null) : (timed && ex.targetReps != null ? ex.targetReps : null),
    rpe:null, completed:false, completedAt:null,
    unit: ex.unit === 'bw' ? 'bw' : (timed ? 'time' : state.settings.unit)
  };
}
/* item is a routine item ({exerciseId, sets, reps, weight, rest}); the returned
   block is the workout-local copy that logging writes into. */
function buildWorkoutExercise(item){
  const exDef = exerciseById(item.exerciseId) || { name:'Unknown exercise', category:'', unit:state.settings.unit, notes:'' };
  const prev = lastPerformance(item.exerciseId);
  const ex = {
    exerciseId:item.exerciseId, name:exDef.name, category:exDef.category || '',
    unit:exDef.unit || 'kg', plannedSets:item.sets || 3,
    targetReps:item.reps != null ? item.reps : 8,
    targetWeight:item.weight != null ? item.weight : null,
    restSeconds:item.rest || state.settings.defaultRest,
    notes:exDef.notes || '', skipped:false, sets:[]
  };
  const n = Math.max(1, item.sets || 3);
  for (let i = 0; i < n; i++){
    const set = newSetFrom(ex, null);
    /* seed the bar with the plan, else with what was lifted last time */
    const prevSet = prev && (prev.sets[i] || prev.sets[0]);
    if (item.weight != null) set.weight = item.weight;
    else if (prevSet && prevSet.weight != null) set.weight = prevSet.weight;
    ex.sets.push(set);
  }
  return ex;
}
function beginWorkout(workout){
  state.activeWorkout = workout;
  save();
  restoreTimer();
  ui.view = 'today';
  ui.selectedRoutineId = null;
  ui.expandedDone.clear();   /* keys are indexes into the previous workout */
  ui.focus = 'workout-title';
  render();
}
/* startRoutine and startEmpty differ only in the workout they build and the
   wording of the "you already have one running" prompt. */
function startSession(build, replaceBody, started){
  const go = () => { beginWorkout(build()); toast(started); };
  if (!state.activeWorkout){ go(); return; }
  confirmDlg('Replace current workout?', replaceBody, 'Discard & start', true)
    .then(ok => { if (ok){ state.activeWorkout = null; go(); } });
}
function newWorkout(routine){
  return {
    id:uid(),
    routineId:routine ? routine.id : null,
    routineName:routine ? routine.name : 'Quick session',
    startedAt:Date.now(), finishedAt:null, notes:'', currentExerciseIndex:0,
    exercises:routine ? routine.items.map(buildWorkoutExercise) : [],
    timer:null
  };
}
function startRoutine(id){
  const r = routineById(id);
  if (!r) return;
  startSession(() => newWorkout(r),
    'You already have a workout in progress. Starting “' + r.name + '” will discard it.',
    'Workout started — ' + r.name);
}
function startEmpty(){
  startSession(() => newWorkout(null),
    'Starting a new session will discard the workout in progress.',
    'Quick session started');
}
/* Default plan for a freshly added exercise: timed work is measured in
   seconds, everything else in reps. */
function newRoutineItem(exId){
  const def = exerciseById(exId);
  return { id:uid(), exerciseId:exId, sets:3,
    reps:(def && def.unit === 'time') ? 30 : 8, weight:null, rest:state.settings.defaultRest };
}
function addExerciseToWorkout(exId){
  const w = state.activeWorkout;
  if (!w || !exId) return;
  const def = exerciseById(exId);
  w.exercises.push(buildWorkoutExercise(newRoutineItem(exId)));
  if (w.currentExerciseIndex >= w.exercises.length - 1 || allSetsDone(w.exercises[w.currentExerciseIndex]))
    w.currentExerciseIndex = w.exercises.length - 1;
  save(); render();
  toast('Added ' + (def ? def.name : 'exercise'));
}
function currentExercise(){
  const w = state.activeWorkout;
  return w ? w.exercises[w.currentExerciseIndex] : null;
}
function allSetsDone(ex){ return ex && ex.sets.length > 0 && ex.sets.every(s => s.completed); }

/* A set left blank falls back to the target. Timed work must land in
   durationSeconds — writing it to `reps` is exactly the v2 bug v3 undid. */
function fillSetDefaults(ex, s){
  const field = ex.unit === 'time' ? 'durationSeconds' : 'reps';
  if (toNum(s[field]) == null) s[field] = ex.targetReps != null ? ex.targetReps : 0;
  if (!s.unit) s.unit = ex.unit === 'time' ? 'time' : (ex.unit === 'bw' ? 'bw' : state.settings.unit);
}
function completeCurrentSet(){
  const w = state.activeWorkout; const ex = currentExercise();
  if (!w || !ex) return;
  const idx = ex.sets.findIndex(s => !s.completed);
  if (idx === -1) return;
  const s = ex.sets[idx];
  fillSetDefaults(ex, s);
  s.completed = true; s.completedAt = Date.now();
  save();
  announce('Set ' + (idx+1) + ' of ' + ex.sets.length + ' complete.');
  const next = ex.sets.find(x => !x.completed);
  ui.focus = next ? 'sw-' + next.id : 'btn-next-ex';
  render();
  if (state.settings.autoRest){
    loadTimer(ex.restSeconds || state.settings.defaultRest);
    startTimer();
  }
}
function toggleSet(setId){
  const ex = currentExercise(); if (!ex) return;
  const s = ex.sets.find(x => x.id === setId); if (!s) return;
  s.completed = !s.completed;
  if (s.completed){ s.completedAt = Date.now(); fillSetDefaults(ex, s); }
  else s.completedAt = null;
  save();
  ui.focus = 'sd-' + setId;
  render();
}
function addSet(){
  const ex = currentExercise(); if (!ex) return;
  const s = newSetFrom(ex, ex.sets[ex.sets.length - 1]);
  ex.sets.push(s);
  save();
  ui.focus = (ex.unit === 'time' ? 'sr-' : 'sw-') + s.id;
  render();
  toast('Set ' + ex.sets.length + ' added');
}
function advanceExercise(markSkipped){
  const w = state.activeWorkout; const ex = currentExercise();
  if (!w || !ex) return;
  if (markSkipped){ ex.skipped = true; announce(ex.name + ' skipped.'); }
  w.currentExerciseIndex = Math.min(w.exercises.length, w.currentExerciseIndex + 1);
  save();
  if (!markSkipped && w.currentExerciseIndex < w.exercises.length)
    announce('Now: ' + w.exercises[w.currentExerciseIndex].name);
  ui.focus = 'ex-panel-top';
  render();
}
function reopenExercise(idx){
  const w = state.activeWorkout; if (!w) return;
  if (idx < 0 || idx >= w.exercises.length) return;
  w.exercises[idx].skipped = false;
  w.currentExerciseIndex = idx;
  ui.expandedDone.delete(String(idx));
  save();
  ui.focus = 'ex-panel-top';
  render();
}
function finishWorkout(){
  const w = state.activeWorkout; if (!w) return;
  const done = workoutSets(w);
  const commit = discard => {
    if (discard){
      state.activeWorkout = null; save(); loadTimer(state.settings.defaultRest); render();
      toast('Workout discarded'); return;
    }
    w.finishedAt = Date.now();
    /* drop rows never touched, then exercises left with nothing to show */
    w.exercises.forEach(ex => {
      ex.sets = ex.sets.filter(s => s.completed || s.weight != null || s.reps != null || s.durationSeconds != null);
    });
    w.exercises = w.exercises.filter(ex => ex.sets.length > 0 || ex.skipped);
    state.workouts.push(w);
    sortWorkouts();
    state.activeWorkout = null;
    save(); loadTimer(state.settings.defaultRest);
    ui.expandedWorkouts.add(w.id);
    navigate('history');
    window.scrollTo(0,0);
    toast('Workout saved — ' + fmtNum(workoutVolume(w)) + ' ' + unitLabel() + ' total');
  };
  if (done === 0){
    dialog({ title:'No sets completed', body:'This workout has no completed sets. Do you want to save it anyway?',
      buttons:[
        { label:'Discard', value:'discard', cls:'btn-danger' },
        { label:'Cancel', value:'cancel', cls:'', autofocus:true },
        { label:'Save anyway', value:'save', cls:'btn-primary' }
      ]}).then(v => { if (v === 'save') commit(false); else if (v === 'discard') commit(true); });
  } else commit(false);
}
function discardWorkout(){
  confirmDlg('Discard workout?','All sets logged in this session will be lost. This cannot be undone.','Discard workout',true)
    .then(ok => {
      if (!ok) return;
      state.activeWorkout = null; save(); loadTimer(state.settings.defaultRest);
      render(); toast('Workout discarded');
    });
}

/* ============================================================
   ACTIONS — routines
   ============================================================ */
function newRoutineDraft(r){
  return r ? deepCopy(r) : { id:null, name:'', items:[] };
}
function saveRoutineDraft(){
  const d = ui.routineDraft; if (!d) return;
  if (!d.name.trim()){ ui.routineError = 'Give the routine a name.'; render(); return; }
  if (d.items.length === 0){ ui.routineError = 'Add at least one exercise.'; render(); return; }
  d.items.forEach(it => {
    it.sets   = clamp(parseInt(it.sets,10) || ITEM_LIMITS.sets[0], ITEM_LIMITS.sets[0], ITEM_LIMITS.sets[1]);
    it.reps   = clamp(parseInt(it.reps,10) || 0, ITEM_LIMITS.reps[0], ITEM_LIMITS.reps[1]);
    it.weight = toNum(it.weight);
    it.rest   = clamp(parseInt(it.rest,10) || state.settings.defaultRest, ITEM_LIMITS.rest[0], ITEM_LIMITS.rest[1]);
  });
  if (d.id){
    const i = state.routines.findIndex(r => r.id === d.id);
    if (i !== -1) state.routines[i] = { id:d.id, name:d.name.trim(), items:d.items };
  } else {
    state.routines.push({ id:uid(), name:d.name.trim(), items:d.items });
  }
  ui.routineDraft = null; ui.routineError = '';
  save(); render(); toast('Routine saved');
}
function duplicateRoutine(id){
  const r = routineById(id); if (!r) return;
  const copy = deepCopy(r);
  copy.id = uid(); copy.name = r.name + ' (copy)';
  copy.items.forEach(it => it.id = uid());
  state.routines.push(copy);
  save(); render(); toast('Duplicated “' + r.name + '”');
}
function deleteRoutine(id){
  const r = routineById(id); if (!r) return;
  confirmDlg('Delete routine?','“' + r.name + '” will be removed. Past workouts in History are not affected.','Delete routine',true)
    .then(ok => {
      if (!ok) return;
      state.routines = state.routines.filter(x => x.id !== id);
      if (ui.routineDraft && ui.routineDraft.id === id) ui.routineDraft = null;
      save(); render(); toast('Routine deleted');
    });
}
function moveRoutineItem(idx, dir){
  const d = ui.routineDraft; if (!d) return;
  const j = idx + dir;
  if (j < 0 || j >= d.items.length) return;
  const tmp = d.items[idx]; d.items[idx] = d.items[j]; d.items[j] = tmp;
  render();
}
function removeRoutineItem(idx){
  const d = ui.routineDraft; if (!d) return;
  d.items.splice(idx,1);
  render();
}
function addRoutineItem(exId){
  const d = ui.routineDraft; if (!d || !exId) return;
  d.items.push(newRoutineItem(exId));
  render();
}

/* ============================================================
   ACTIONS — exercises
   ============================================================ */
function saveNewExercise(form){
  const name = form.name.trim();
  if (!name){ ui.exerciseFormError = 'Name is required.'; render(); return; }
  if (state.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())){
    ui.exerciseFormError = 'An exercise with this name already exists.'; render(); return;
  }
  state.exercises.push({
    id:uid(), name,
    category: form.category.trim() || 'General',
    unit: form.unit || 'kg',
    notes: form.notes.trim()
  });
  ui.showExerciseForm = false; ui.exerciseFormError = '';
  save(); render(); toast('Exercise added — ' + name);
}
function saveExerciseDraft(){
  const d = ui.exerciseDraft; if (!d) return;
  if (!d.name.trim()){ toast('Name is required'); return; }
  const i = state.exercises.findIndex(e => e.id === d.id);
  if (i === -1) return;
  state.exercises[i] = { id:d.id, name:d.name.trim(), category:d.category.trim() || 'General', unit:d.unit, notes:d.notes.trim() };
  ui.exerciseDraft = null;
  save(); render(); toast('Exercise updated');
}
function deleteExercise(id){
  const ex = exerciseById(id); if (!ex) return;
  const usedBy = state.routines.filter(r => r.items.some(it => it.exerciseId === id)).length;
  const extra = usedBy ? ' It is used by ' + usedBy + ' routine' + (usedBy > 1 ? 's' : '') + ', which will show it as removed.' : '';
  confirmDlg('Delete exercise?','“' + ex.name + '” will be removed from your library.' + extra,'Delete exercise',true)
    .then(ok => {
      if (!ok) return;
      state.exercises = state.exercises.filter(e => e.id !== id);
      if (ui.exerciseDraft && ui.exerciseDraft.id === id) ui.exerciseDraft = null;
      save(); render(); toast('Exercise deleted');
    });
}

/* ============================================================
   ACTIONS — settings / data
   ============================================================ */
function setTheme(v){ state.settings.theme = v; applyTheme(); save(); }
function setUnit(v){
  const from = state.settings.unit;
  if (v === from) return;
  state.settings.unit = v;
  const conv = x => { const n = toNum(x); return n == null ? x : roundHalf(convertWeight(n, from, v)); };
  /* Routine targets carry no unit of their own — they are always in the
     display unit, so they are rewritten in place. */
  state.routines.forEach(r => r.items.forEach(it => { it.weight = conv(it.weight); }));
  /* Sets in the running session are re-tagged as well as re-valued; leaving a
     converted weight labelled with the old unit would convert it twice. */
  if (state.activeWorkout){
    state.activeWorkout.exercises.forEach(ex => {
      ex.targetWeight = conv(ex.targetWeight);
      ex.sets.forEach(set => {
        if (set.unit !== from) return;
        set.weight = conv(set.weight);
        set.unit = v;
      });
    });
  }
  save(); render();
  toast('Weights converted to ' + v);
}
/* ---------- JSON file helpers ---------- */
function dateStamp(prefix){
  const d = new Date();
  return prefix + '-' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.json';
}
function downloadJSON(payload, filename){
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function readJSONFile(file, cb){
  const reader = new FileReader();
  reader.onload = () => {
    try{ cb(JSON.parse(reader.result)); }
    catch(e){ toast('That file is not valid JSON'); }
  };
  reader.readAsText(file);
}

/* ---------- full backup ---------- */
function exportData(){
  downloadJSON(Object.assign(
    { schemaVersion:EXPORT_SCHEMA, source:'liftlog-web', exportedAt:new Date().toISOString() },
    deepCopy(state)), dateStamp('liftlog-export'));
  toast('Data exported');
}
function importData(file){
  readJSONFile(file, obj => {
    if (!obj || !(obj.version >= 1 && obj.version <= SCHEMA_VERSION) || !Array.isArray(obj.exercises)){
      toast('Unrecognized file — expected a Liftlog export'); return;
    }
    confirmDlg('Import data?','This replaces everything currently stored (exercises, routines, history, settings) with the imported file.','Import & replace',true)
      .then(ok => {
        if (!ok) return;
        if (obj.version === 1) migrateToV2(obj);
        if (obj.version === 2) migrateToV3(obj);   /* older backups: seconds move out of reps */
        state = normalizeState(obj);
        applyTheme(); save(); loadTimer(state.settings.defaultRest);
        resetUI();
        render(); toast('Import complete');
      });
  });
}

/* ---------- routines: export / import ---------- */
/* Routines travel with the exercise definitions they reference, so an
   import into another browser can rebuild any missing library entries. */
function exportRoutines(){
  if (!state.routines.length){ toast('No routines to export'); return; }
  const used = new Set();
  state.routines.forEach(r => (r.items || []).forEach(it => used.add(it.exerciseId)));
  downloadJSON({
    app:'liftlog', kind:'routines', schemaVersion:EXPORT_SCHEMA, source:'liftlog-web',
    version:SCHEMA_VERSION, exportedAt:new Date().toISOString(),
    exercises:state.exercises.filter(e => used.has(e.id)),
    routines:state.routines
  }, dateStamp('liftlog-routines'));
  toast('Routines exported');
}
function importRoutines(file){
  readJSONFile(file, obj => {
    if (!obj) return;
    const list = Array.isArray(obj) ? obj : obj.routines;
    const exIn = Array.isArray(obj.exercises) ? obj.exercises : [];
    if (!Array.isArray(list) || !list.length){ toast('No routines found in that file'); return; }
    const byName = n => state.exercises.find(e => e.name.trim().toLowerCase() === String(n || '').trim().toLowerCase());
    let addedR = 0, skippedR = 0, addedEx = 0;
    list.forEach(r => {
      if (!r || !r.name || !Array.isArray(r.items) ||
          state.routines.some(x => x.name.trim().toLowerCase() === String(r.name).trim().toLowerCase())){ skippedR++; return; }
      const items = r.items.map(it => {
        if (!it) return null;
        /* resolve the target exercise: by id first, then by name; add it if unknown */
        let local = it.exerciseId ? state.exercises.find(e => e.id === it.exerciseId) : null;
        const src = exIn.find(e => e.id === it.exerciseId);
        if (!local && src) local = byName(src.name);
        if (!local && src){
          state.exercises.push({ id:uid(), name:String(src.name), category:String(src.category || 'General'),
            unit:isUnit(src.unit) ? src.unit : 'kg', notes:String(src.notes || '') });
          local = state.exercises[state.exercises.length - 1]; addedEx++;
        }
        if (!local) return null;
        return { id:uid(), exerciseId:local.id,
          sets:clamp(Number(it.sets) || 3, ITEM_LIMITS.sets[0], ITEM_LIMITS.sets[1]),
          reps:clamp(Number(it.reps) || 8, ITEM_LIMITS.reps[0], ITEM_LIMITS.reps[1]),
          weight:toNum(it.weight),
          rest:clamp(Number(it.rest) || state.settings.defaultRest, ITEM_LIMITS.rest[0], ITEM_LIMITS.rest[1]) };
      }).filter(Boolean);
      if (!items.length){ skippedR++; return; }
      state.routines.push({ id:uid(), name:String(r.name).trim(), items });
      addedR++;
    });
    save(); render();
    toast('Imported ' + plural(addedR, 'routine') +
      (skippedR ? ' · skipped ' + skippedR + ' duplicate or invalid' : '') +
      (addedEx ? ' · added ' + plural(addedEx, 'new exercise', 's') : ''));
  });
}

/* ---------- history: export / import ---------- */
function exportHistory(){
  if (!state.workouts.length){ toast('No workout history to export'); return; }
  /* export sets with an explicit setType so importers never guess at field semantics */
  const setTypeOf = s => s.distance != null ? 'distance' : (s.unit === 'time' || s.durationSeconds != null) ? 'time' : 'reps';
  const workouts = deepCopy(state.workouts);
  workouts.forEach(w => w.exercises.forEach(ex => (ex.sets || []).forEach(s => { s.setType = setTypeOf(s); })));
  downloadJSON({
    app:'liftlog', kind:'history', schemaVersion:EXPORT_SCHEMA, source:'liftlog-web',
    version:SCHEMA_VERSION, exportedAt:new Date().toISOString(),
    workouts
  }, dateStamp('liftlog-history'));
  toast('History exported');
}
/* ---- import normalization (schema 1.0.0 contract) ----
   Sets: `setType` ("reps"|"time"|"hold"|"distance") decides which fields carry data.
   Legacy files without setType fall back to the exercise/set unit ("time" unit →
   seconds in `reps` are moved into durationSeconds). Numeric bounds are coerced,
   includeInVolume is accepted as an alias of countForVolume. */
function normalizeImportedSet(s, exUnit){
  const num = toNum;
  const o = { id:s.id || uid() };
  o.weight = num(s.weight);          if (o.weight != null && o.weight < 0) o.weight = null;
  o.reps = num(s.reps);              if (o.reps != null) o.reps = Math.max(0, Math.round(o.reps));
  o.rpe = num(s.rpe);                if (o.rpe != null) o.rpe = Math.min(10, Math.max(1, o.rpe));
  o.durationSeconds = num(s.durationSeconds);
  if (o.durationSeconds != null && o.durationSeconds < 0) o.durationSeconds = null;
  o.distance = num(s.distance);
  /* distanceUnit is free text in the contract; keep it short and inert */
  if (o.distance != null && o.distance >= 0)
    o.distanceUnit = String(s.distanceUnit || 'm').replace(/[^\w/²³°.-]/g, '').slice(0, 8) || 'm';
  o.completed = !!s.completed;
  o.completedAt = (typeof s.completedAt === 'number' && s.completedAt > 0) ? s.completedAt : 0;
  /* execution (completed) is separate from analytics inclusion; only explicit opt-outs are stored */
  const cv = s.countForVolume != null ? s.countForVolume : s.includeInVolume;
  if (cv === false) o.countForVolume = false;
  if (s.countForPR === false) o.countForPR = false;
  /* interpret by setType first, then by unit (legacy files) */
  const unit = isUnit(s.unit) ? s.unit : (isUnit(exUnit) ? exUnit : 'kg');
  if (s.setType === 'distance'){ o.unit = unit === 'time' ? 'kg' : unit; o.reps = null; }
  else if (s.setType === 'time' || s.setType === 'hold' || unit === 'time'){
    o.unit = 'time';
    if (o.durationSeconds == null && o.reps != null) o.durationSeconds = o.reps; /* legacy: seconds in reps */
    o.reps = null;
  } else { o.unit = unit; }
  return o;
}
function normalizeImportedWorkout(w){
  const ts = v => typeof v === 'number' && isFinite(v) ? v : (typeof v === 'string' && v && !isNaN(Date.parse(v)) ? Date.parse(v) : NaN);
  const started = ts(w.startedAt);
  if (isNaN(started) || !Array.isArray(w.exercises)) return null;
  const o = {
    id:String(w.id), routineId:w.routineId != null ? String(w.routineId) : null,
    routineName:typeof w.routineName === 'string' && w.routineName ? w.routineName : 'Imported session',
    startedAt:started, finishedAt:isNaN(ts(w.finishedAt)) ? null : ts(w.finishedAt),
    notes:typeof w.notes === 'string' ? w.notes : '', exercises:[]
  };
  if (o.finishedAt != null && o.finishedAt < o.startedAt) o.finishedAt = o.startedAt; /* no negative durations */
  w.exercises.forEach(ex => {
    if (!ex) return;
    const block = {
      exerciseId:ex.exerciseId != null ? String(ex.exerciseId) : null,
      name:typeof ex.name === 'string' && ex.name ? ex.name : 'Unknown exercise',
      category:typeof ex.category === 'string' ? ex.category : '',
      unit:isUnit(ex.unit) ? ex.unit : 'kg',
      plannedSets:Number(ex.plannedSets) > 0 ? Math.round(ex.plannedSets) : null,
      targetReps:toNum(ex.targetReps), targetWeight:toNum(ex.targetWeight),
      restSeconds:Number(ex.restSeconds) >= 0 ? Math.round(ex.restSeconds) : 0,
      notes:typeof ex.notes === 'string' ? ex.notes : '', skipped:!!ex.skipped,
      sets:(Array.isArray(ex.sets) ? ex.sets : []).map(s => s ? normalizeImportedSet(s, ex.unit) : null).filter(Boolean)
    };
    o.exercises.push(block);
  });
  o.currentExerciseIndex = Number.isInteger(w.currentExerciseIndex) ? w.currentExerciseIndex : o.exercises.length;
  return o;
}

function importHistory(file){
  readJSONFile(file, obj => {
    if (!obj) return;
    const list = Array.isArray(obj) ? obj : obj.workouts;
    if (!Array.isArray(list) || !list.length){ toast('No workout history found in that file'); return; }
    const have = new Set(state.workouts.map(w => w.id));
    let added = 0, skipped = 0;
    list.forEach(raw => {
      const w = (raw && raw.id && raw.startedAt) ? normalizeImportedWorkout(raw) : null;
      if (!w || have.has(w.id)){ skipped++; return; }   /* dedupe by workout id: first write wins */
      state.workouts.push(w); have.add(w.id); added++;
    });
    sortWorkouts();
    save(); render();
    toast('Imported ' + plural(added, 'workout') +
      (skipped ? ' · skipped ' + skipped + ' duplicate or invalid' : ''));
  });
}

function clearAllData(){
  dialog({ title:'Clear all data?', body:'This permanently deletes all exercises, routines, workouts and settings stored in this browser.',
    buttons:[
      { label:'Cancel', value:false, cls:'', autofocus:true },
      { label:'Clear everything', value:true, cls:'btn-danger-solid' }
    ]}).then(ok => {
    if (!ok) return;
    state = { version:SCHEMA_VERSION, settings:defaultSettings(), exercises:[], routines:[], workouts:[], activeWorkout:null };
    applyTheme(); save(); loadTimer(state.settings.defaultRest);
    resetUI();
    render(); toast('All data cleared');
  });
}
function loadSamples(){
  confirmDlg('Load sample data?','Sample exercises and routines will replace the current ones. Workout history is kept.','Load samples')
    .then(ok => {
      if (!ok) return;
      state.exercises = sampleExercises();
      state.routines = sampleRoutines(state.exercises);
      resetUI();
      save(); render(); toast('Sample data loaded');
    });

/* ============================================================
   RENDERING
   ============================================================ */
function render(){
  clearStatsCache();
  normalizeSelections();
  renderNav();
  const main = $('#main');
  const switched = ui.prevView !== ui.view;
  ui.prevView = ui.view;
  main.innerHTML = viewHTML();
  if (switched) window.scrollTo(0,0);
  drawTimer();
  applyFocus();
}
/* Templates must not mutate ui while they build strings, so the two selections
   that can dangle (a deleted routine, a deleted trend exercise) settle here. */
function normalizeSelections(){
  if (state.routines.length && !routineById(ui.selectedRoutineId))
    ui.selectedRoutineId = state.routines[0].id;
  const trendable = trendCandidates();
  if (trendable.length && !trendable.some(e => e.id === ui.trendExId))
    ui.trendExId = trendable[0].id;
}
function trendCandidates(){
  return state.exercises.filter(e =>
    state.workouts.some(w => w.exercises.some(x => x.exerciseId === e.id && x.sets.some(s => s.completed))));
}
function applyFocus(){
  if (!ui.focus) return;
  const el = document.getElementById(ui.focus);
  ui.focus = null;
  if (el){ el.focus({ preventScroll:false }); if (el.select) el.select(); }
}
function renderNav(){
  $$('#nav-list .nav-btn').forEach(b => {
    const cur = b.dataset.view === ui.view;
    if (cur) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    /* small live dot on Today while a workout is running */
    const hasDot = $('.dot', b);
    if (b.dataset.view === 'today' && state.activeWorkout && !hasDot){
      b.insertAdjacentHTML('beforeend','<span class="dot" aria-hidden="true"></span><span class="sr-only">(workout in progress)</span>');
    } else if (b.dataset.view === 'today' && !state.activeWorkout && hasDot){
      hasDot.remove();
      const sr = b.querySelector('.sr-only'); if (sr) sr.remove();
    }
  });
}

function viewHTML(){
  switch(ui.view){
    case 'routines':  return viewRoutines();
    case 'history':   return viewHistory();
    case 'exercises': return viewExercises();
    case 'settings':  return viewSettings();
    default:          return viewToday();
  }
}

/* ---------- TODAY ---------- */
function viewToday(){

function htmlPicker(){

  if (last){
    html += '<section class="panel last-session" aria-label="Last session">' +
      '<div class="pad last-session-row">' +
        '<strong>Last session</strong>' +
        '<span class="small">' + esc(last.routineName) + '</span>' +
        '<span class="muted small">' + fmtDate(last.startedAt) + ' · ' + plural(workoutSets(last), 'set') + ' · ' + fmtNum(workoutVolume(last)) + ' ' + unitLabel() + '</span>' +
        '<button type="button" class="btn btn-sm push-right" data-action="go-history">Open history</button>' +
      '</div></section>';
  }
  html += '<section aria-labelledby="pick-title"><div class="section-title"><h2 id="pick-title">Start a workout</h2><span class="rule"></span></div>';

    html += '<div class="empty"><h3>No routines yet</h3><p>Create a routine or load the samples to get going.</p>' +
      '<div class="form-actions"><button type="button" class="btn btn-primary" data-action="nav" data-view="routines">Go to Routines</button>' +
      '<button type="button" class="btn" data-action="load-samples">Load sample data</button></div></div>';

    html += '<div class="routine-pick" role="group" aria-label="Choose a routine">';

      const sel = r.id === ui.selectedRoutineId;
      const planned = r.items.reduce((a,it) => a + (it.sets || 0), 0);
      html += '<div class="routine-pick-row' + (sel ? ' is-selected' : '') + '">' +
        '<button type="button" class="rp-select" data-action="select-routine" data-id="' + r.id + '" aria-pressed="' + sel + '">' +
          '<span class="rp-name">' + esc(r.name) + '</span>' +
          '<span class="rp-meta">' + plural(r.items.length, 'exercise') + ' · ' + planned + ' planned sets</span>' +
        '</button>' +
        '<span class="rp-go"><button type="button" class="btn btn-primary btn-sm" data-action="routine-start" data-id="' + r.id + '" ' +
          'aria-label="Start ' + esc(r.name) + '">' + IC.play + '<span>Start</span></button></span>' +
      '</div>';
    });
    html += '</div>' +
      '<p class="hint mt-2">Tip: press <kbd>s</kbd> to start the highlighted routine.</p>';
  }
  html += '</section>';
  html += '<div class="mt-3"><button type="button" class="btn" data-action="start-empty">' + IC.plus + '<span>Start empty session</span></button></div>';
  return html;
}

function htmlActiveWorkout(w){
  const ex = currentExercise();
  const doneSets = workoutSets(w);
  const planned = workoutPlannedSets(w);
  const pct = planned ? Math.round(doneSets/planned*100) : 0;
  const allDone = w.exercises.length > 0 && w.currentExerciseIndex >= w.exercises.length;

  let html = '<section class="panel ex-panel" aria-label="Active workout">' +
    '<div class="pad">' +
      '<div class="workout-head">' +
        '<div>' +
          '<h1 class="workout-title" id="workout-title" tabindex="-1">' + esc(w.routineName) + '</h1>' +
          '<p class="workout-meta">' +
            '<span>Started ' + fmtTime(w.startedAt) + '</span>' +
            '<span class="mono" id="workout-elapsed">' + fmtDuration(Date.now() - w.startedAt) + '</span>' +
            '<span>' + doneSets + '/' + planned + ' sets</span>' +
          '</p>' +
        '</div>' +
        '<div class="workout-head-actions">' +
          '<button type="button" class="btn btn-danger" data-action="discard-workout">' + IC.trash + '<span>Discard</span></button>' +
          '<button type="button" class="btn btn-primary" data-action="finish-workout">' + IC.flag + '<span>Finish workout</span></button>' +
        '</div>' +
      '</div>' +
      '<div class="progress-line">' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<p class="progress-label">' + (w.exercises.length ? 'Exercise ' + Math.min(w.currentExerciseIndex+1, w.exercises.length) + ' of ' + w.exercises.length : 'No exercises yet') + ' · ' + pct + '% of sets done</p>' +
      '</div>' +
    '</div>';

  if (ex){
    html += htmlCurrentExercise(w, ex);
  } else if (allDone && w.exercises.length){
    html += '<div class="pad" id="ex-panel-top" tabindex="-1">' +
      '<div class="empty is-solid"><h3>All exercises done</h3>' +
      '<p>' + doneSets + ' sets completed · ' + fmtNum(workoutVolume(w)) + ' ' + unitLabel() + ' total volume.</p>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn btn-primary btn-big" data-action="finish-workout">' + IC.flag + '<span>Finish workout</span></button>' +
      '</div></div></div>';
  } else {
    html += '<div class="pad" id="ex-panel-top" tabindex="-1">' +
      '<p class="muted">No exercises in this session yet — add one below.</p></div>';
  }

  /* session notes */
  html += '<div class="pad divider-top">' +
    '<label class="field"><span class="cap">Session notes</span>' +
    '<textarea data-bind="wnotes" rows="2" placeholder="Optional — how did it feel?">' + esc(w.notes || '') + '</textarea></label></div>';

  html += '</section>';

  html += htmlTimerPanel();
  html += htmlAddExercise();

  /* sticky one-handed action bar */
  if (ex){
    const hasOpen = ex.sets.some(s => !s.completed);
    html += '<div class="sticky-actions">' +
      (hasOpen
        ? '<button type="button" class="btn btn-primary btn-big" data-action="complete-current" id="btn-complete">' + IC.check + '<span>Complete set ' + (ex.sets.findIndex(s => !s.completed)+1) + '</span><span class="mono xs key-hint">(c)</span></button>'
        : '<button type="button" class="btn btn-primary btn-big" data-action="next-exercise" id="btn-next-ex">' + IC.skip + '<span>' + (w.currentExerciseIndex + 1 >= w.exercises.length ? 'Done — wrap up' : 'Next exercise') + '</span><span class="mono xs key-hint">(n)</span></button>') +
      '<button type="button" class="btn btn-big flex-none" data-action="add-set">' + IC.plus + '<span>Set</span></button>' +
      '<button type="button" class="btn btn-big btn-quiet flex-none" data-action="skip-exercise" title="Skip this exercise">' + IC.skip + '<span class="sr-only">Skip exercise</span></button>' +
    '</div>';
  }

  html += htmlDoneExercises(w);
  return html;
}

function htmlCurrentExercise(w, ex){
  const stats = exerciseStats(ex.exerciseId);
  const prev = stats.last;
  const showWeight = ex.unit !== 'bw' && ex.unit !== 'time';
  const repsLabel = ex.unit === 'time' ? 'sec' : 'reps';
  const wLabel = unitLabel();

  let prevHTML = '';
  const bits = [];
  const bit = (k, v) => bits.push('<span class="pp-item"><span class="pp-k">' + k + '</span><strong>' + v + '</strong></span>');
  if (prev) bit('Last · ' + esc(relDays(prev.date)), prev.sets.slice(0,4).map(setSummary).join(', '));
  if (showWeight && stats.e1rm > 0) bit('Best e1RM', fmtNum(roundHalf(stats.e1rm)) + ' ' + unitLabel());
  if (showWeight && stats.volume > 0) bit('Best volume', fmtNum(stats.volume) + ' ' + unitLabel());
  if (ex.unit === 'bw' && stats.reps > 0) bit('Best set', stats.reps + ' reps');
  if (ex.unit === 'time' && stats.duration > 0) bit('Best hold', stats.duration + ' s');
  if (bits.length) prevHTML = '<div class="prev-perf">' + bits.join('') + '</div>';

  const currentIdx = ex.sets.findIndex(s => !s.completed);

  let setsHTML =
    '<div class="sets-head" aria-hidden="true">' +
      '<span>Set</span>' +
      (showWeight ? '<span>Weight (' + esc(wLabel) + ')</span><span>' + esc(repsLabel) + '</span>'
                  : '<span>' + esc(repsLabel) + '</span><span></span>') +
      '<span>RPE</span><span>Done</span>' +
    '</div>';

  ex.sets.forEach((s, i) => {
    const isCur = i === currentIdx;
    const prevSet = prev && prev.sets[i] ? setSummary(prev.sets[i]) : '';
    setsHTML += '<div class="set-row' + (isCur ? ' is-current' : '') + (s.completed ? ' is-done' : '') + '">' +
      '<div class="set-num"><span class="n">' + (i+1) + '</span>' +
        (prevSet ? '<span class="prev" title="Previous session">' + prevSet + '</span>' : '') +
      '</div>';
    if (showWeight){
      setsHTML += '<label class="field"><span class="cap">' + esc(wLabel) + '</span>' +
        '<input id="sw-' + s.id + '" type="number" inputmode="decimal" min="0" step="0.5" ' +
        'data-bind="set" data-id="' + s.id + '" data-field="weight" ' +
        'value="' + (s.weight != null ? s.weight : '') + '" placeholder="0"></label>';
    } else {
      setsHTML += '<label class="field"><span class="cap">' + (ex.unit === 'bw' ? 'BW' : 'type') + '</span>' +
        '<input type="text" disabled value="' + (ex.unit === 'bw' ? 'bodyweight' : 'timed') + '"></label>';
    }
    const timedField = ex.unit === 'time';
    const midVal = timedField ? setDuration(s) : s.reps;
    setsHTML += '<label class="field"><span class="cap">' + esc(repsLabel) + '</span>' +
      '<input id="sr-' + s.id + '" type="number" inputmode="numeric" min="0" step="1" ' +
      'data-bind="set" data-id="' + s.id + '" data-field="' + (timedField ? 'durationSeconds' : 'reps') + '" ' +
      'value="' + (midVal != null ? midVal : '') + '" placeholder="' + (ex.targetReps != null ? ex.targetReps : '0') + '"></label>';
    setsHTML += '<label class="field"><span class="cap">RPE</span>' +
      '<input type="number" inputmode="decimal" min="1" max="10" step="0.5" ' +
      'data-bind="set" data-id="' + s.id + '" data-field="rpe" ' +
      'value="' + (s.rpe != null ? s.rpe : '') + '" placeholder="–"></label>';
    setsHTML += '<button type="button" id="sd-' + s.id + '" class="btn set-done-btn" data-action="toggle-set" data-id="' + s.id + '" ' +
      'aria-pressed="' + s.completed + '" aria-label="' + (s.completed ? 'Mark set ' + (i+1) + ' as not done' : 'Mark set ' + (i+1) + ' as done') + '">' +
      (s.completed ? IC.boxcheck : IC.box) + '</button>';
    setsHTML += '</div>';
  });

  return '<div class="pad divider-top" id="ex-panel-top" tabindex="-1">' +
    '<div class="ex-head">' +
      '<h2 class="ex-name">' + esc(ex.name) + '</h2>' +
      '<span class="ex-tags">' +
        (ex.category ? '<span class="tag">' + esc(ex.category) + '</span>' : '') +
        '<span class="tag">target ' + ex.sets.length + ' × ' + (ex.targetReps != null ? ex.targetReps : '–') +
          (ex.targetWeight != null ? ' @ ' + fmtNum(ex.targetWeight) + ' ' + unitLabel() : '') + '</span>' +
        '<span class="tag">' + icon('timer','ic-inline') + ' rest ' + fmtClock(ex.restSeconds || state.settings.defaultRest) + '</span>' +
      '</span>' +
    '</div>' +
    prevHTML +
    (ex.notes ? '<p class="ex-notes">“' + esc(ex.notes) + '”</p>' : '') +
    '<div class="mt-4" role="group" aria-label="Sets for ' + esc(ex.name) + '">' + setsHTML + '</div>' +
    '<div class="sets-foot">' +
      '<button type="button" class="btn" data-action="add-set">' + IC.plus + '<span>Add set</span></button>' +
      (currentIdx === -1 && w.currentExerciseIndex + 1 < w.exercises.length
        ? '<button type="button" class="btn btn-primary" data-action="next-exercise" id="btn-next-ex">' + IC.skip + '<span>Next exercise</span></button>'
        : '<button type="button" class="btn btn-quiet" data-action="skip-exercise">' + IC.skip + '<span>Skip exercise</span></button>') +
    '</div>' +
  '</div>';
}

function htmlDoneExercises(w){
  const doneIdxs = [];
  w.exercises.forEach((ex, i) => {
    if (i < w.currentExerciseIndex || (allSetsDone(ex) && i !== w.currentExerciseIndex) || ex.skipped) doneIdxs.push(i);
  });
  if (!doneIdxs.length) return '';
  let html = '<section class="panel mt-4" aria-label="Completed exercises"><div class="pad"><h2 class="panel-title">Earlier in this workout</h2></div>';
  doneIdxs.forEach(i => {
    const ex = w.exercises[i];
    const open = ui.expandedDone.has(String(i));
    const completed = ex.sets.filter(s => s.completed);
    const status = ex.skipped ? '<span class="status-chip skip">Skipped</span>'
      : '<span class="status-chip ok">' + (allSetsDone(ex) ? icon('check','ic-xs') + ' ' : '') +
        completed.length + '/' + ex.sets.length + '</span>';
    html += '<button type="button" class="done-ex-row" data-action="toggle-done-ex" data-idx="' + i + '" aria-expanded="' + open + '">' +
      status + '<strong>' + esc(ex.name) + '</strong>' +
      '<span class="muted small">' + completed.map(setSummary).join(', ') + '</span>' +
      IC.chev + '</button>';
    if (open){
      html += '<div class="done-ex-detail">' +
        (ex.sets.map((s, j) => '<div class="dset"><span class="muted">Set ' + (j+1) + '</span><span>' + setSummary(s) +
          (s.rpe != null ? ' <span class="muted">@ RPE ' + s.rpe + '</span>' : '') +
          (s.completed ? '' : ' <span class="status-chip skip">open</span>') + '</span></div>').join('')) +
        '<div class="mt-2"><button type="button" class="btn btn-sm" data-action="reopen-exercise" data-idx="' + i + '">Reopen exercise</button></div>' +
      '</div>';
    }
  });
  html += '</section>';
  return html;
}

  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function htmlWorkoutDetail(w){
  if (ui.editWorkoutId === w.id) return htmlWorkoutEditor(w);
  let html = '<div class="hist-detail">' +
    '<div class="hedit-bar"><button type="button" class="btn" data-action="history-edit" data-id="' + w.id + '">' + IC.pen + '<span>Edit session</span></button></div>';
  if (w.notes) html += '<p class="small quote mb-3">“' + esc(w.notes) + '”</p>';
  let shown = 0;
  w.exercises.forEach(ex => {
    /* every completed set is shown: countForPR only decides what counts as a
       record, it is not a reason to hide work that was actually done */
    const done = ex.sets.filter(s => s.completed);
    if (!done.length && !ex.skipped) return;
    shown++;
    const top = done.filter(countsPR).reduce((a,s) => Math.max(a, epley(setWeight(s), s.reps)), 0);
    html += '<div class="hist-ex"><h4>' + esc(ex.name) +
      (ex.skipped ? ' <span class="status-chip skip">skipped</span>' : '') +
      (top > 0 ? ' <span class="muted top-e1rm">· top e1RM ' + fmtNum(roundHalf(top)) + ' ' + unitLabel() + '</span>' : '') +
      '</h4>' +
      '<p class="hist-sets">' +
      (done.length
        ? done.map(s => setSummary(s) + (s.rpe != null ? ' @' + s.rpe : '') +
            (countsVolume(s) ? '' : ' <span class="status-chip skip">warm-up</span>')).join(' · ')
        : 'No completed sets') +
      '</p></div>';
  });
  if (!shown) html += '<p class="muted small">No completed sets in this session.</p>';
  html += '</div>';
  return html;
}
