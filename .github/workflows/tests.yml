# Runs both browser suites (tests/README.md) on every pull request and on main.
#
# The suites run inside Playwright's own image rather than on a bare runner:
# they assert layout at phone widths, and those results depend on which fonts
# are installed. The image fixes the font set as well as the browser, so a run
# means the same thing every time. Its tag is read from package.json by the
# first job, so bumping Playwright there (by hand or by Dependabot) is the only
# edit an upgrade needs.
name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # the exact version package.json pins, which the image tags follow
      - id: read
        run: |
          version=$(node -p "require('./package.json').devDependencies.playwright")
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "playwright must be pinned to an exact version, got '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  browser-tests:
    needs: playwright-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression suite
        run: npm run test:regression
      # runs even when the regression suite failed, so one red run reports both
      - name: Security suite
        if: ${{ !cancelled() }}
        run: npm run test:security
      - name: Keep screenshots from a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: /tmp/liftlog-*.png
          if-no-files-found: ignore
